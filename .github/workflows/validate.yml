# Validates the catalog corpus against musher-dev/specifications.
#
# The suite is pinned to one exact release per family (RELEASES in
# tests/lib/spec-schemas.ts). It fetches those releases' schemas from
# specifications.musher.dev and their conformance corpora from the GitHub
# release assets, and checks every byte against a recorded SHA-256. Pinned bytes never
# change, so nothing here runs on a schedule: a verdict changes only with a
# commit to this repository, including the one that adopts a new release.
#
# No credential is involved: both origins are public and the suite reads no token.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint the workflows
        uses: rhysd/actionlint@main

      - name: Validate the corpus
        run: npm test

# Developer tools with no devcontainer Feature.
#
# Everything that has a Feature is pinned in devcontainer.json and baked into
# the image. Everything else is pinned here, whatever it is distributed as —
# mise resolves each tool for the container's own CPU architecture, which is
# what a hand-placed release binary does not do. Claude Code is the exception:
# it self-updates through its own installer (scripts/lib/base-setup.sh).
#
# yamllint must stay in step with .github/workflows/validate.yml, which installs
# it itself, and so must actionlint if a workflow ever does. Two environments,
# one version — CI is not a mise host and does not read this file.
#
# Pinned exactly rather than to a range. A range resolves the newest match
# through the GitHub API on every run, so a degraded API takes the whole setup
# down before it reaches a single check.
#
# This file is .config/mise/config.toml, not .devcontainer/mise.toml, so the
# organization's shared dev container (musher-dev/development-container), whose
# mise reads a repository's .config/mise/config.toml and nothing under
# .devcontainer/, installs the same pins as this repository's own container,
# which points MISE_GLOBAL_CONFIG_FILE here (devcontainer.json).
#
# Change a version here, then rebuild the container or run `mise install`.
# Docs: https://mise.jdx.dev

[tools]
"actionlint"   = "1.7.11"
"npm:lefthook" = "2.1.10"
# yamllint is a Python tool installed through uv, which also fetches the
# interpreter it runs on: the container has no system Python to lean on.
"aqua:astral-sh/uv" = "0.12.18"
"pipx:yamllint"     = "1.38.0"
# Codex, the coding agent the container offers beside Claude Code; its login
# lives on the codex-config volume. npm's package, because Node is already here
# as a Feature.
"npm:@openai/codex" = "0.143.0"
# crane reads an image's tags, digest and config (user, exposed ports,
# entrypoint, env) straight from the registry, with no Docker daemon. Authoring
# an item pins an exact tag and cites the image's own defaults, and this
# container has no Docker to pull with.
"github:google/go-containerregistry" = "0.22.1"

[settings]
# pipx tools install through uv rather than a system pipx.
pipx.uvx = true

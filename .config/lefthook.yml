# Git hooks. Lefthook discovers this file itself, by searching
# `lefthook.*` -> `.lefthook.*` -> `.config/lefthook.*` and stopping at the
# first match — which is why it is the one config here not passed by path, and
# why a stray lefthook.yml at the repo root would silently shadow it.
#
# Keep min_version in step with .devcontainer/mise.toml.
min_version: 2.1.10

# Without doublestar, `**/*.md` matches only files in a subdirectory, so the
# root README.md and ICONS.md would never reach the markdown job.
glob_matcher: doublestar

# The split between the two hooks is about the network.
#
# `npm test` fetches the spec bundles from specifications.musher.dev on every
# run — that is the point of it — so it cannot be a pre-commit job: a commit on a
# train would fail for a reason that has nothing to do with the commit. Pre-commit
# holds the checks that are local and fast; pre-push holds the one that is
# neither.
pre-commit:
  parallel: true
  jobs:
    - name: types
      glob: 'tests/**/*.ts'
      run: task typecheck

    - name: shell
      glob: '.devcontainer/**/*.sh'
      run: task check:shell

    - name: workflow
      glob: '.github/workflows/*.{yml,yaml}'
      run: task check:workflow

    - name: yaml
      glob: '**/*.{yml,yaml}'
      # Only what is being committed: an unrelated file elsewhere in the
      # working tree must not block the commit. `task check:yaml` lints all.
      run: yamllint -c .config/yaml/yamllint.yaml --strict {staged_files}
      fail_text: "YAML lint failed. Run 'task check:yaml'; the rules are in .config/yaml/yamllint.yaml."

    - name: markdown
      glob: '**/*.md'
      run: node_modules/.bin/markdownlint-cli2 --config .config/markdown/markdownlint.jsonc {staged_files}
      fail_text: "Markdown lint failed. Run 'task fmt:md' for what it can fix, then 'task check:md'."

pre-push:
  jobs:
    - name: validate
      run: task test

commit-msg:
  jobs:
    - name: conventional-commits
      run: |
        sh -ceu '
        first_line=$(head -n 1 "$1")
        case "$first_line" in
          Merge*) exit 0 ;;
        esac
        pattern="^(feat|fix|chore|docs|style|refactor|perf|test|ci|build|revert)(\\(.+\\))?(!)?: .+"
        if ! printf "%s\n" "$first_line" | grep -Eq "$pattern"; then
          printf "%s\n" "ERROR: Commit message does not follow Conventional Commits format." >&2
          printf "%s\n" "" >&2
          printf "%s\n" "  Expected: <type>(<scope>): <description>" >&2
          printf "  Got:      %s\n" "$first_line" >&2
          printf "%s\n" "" >&2
          printf "%s\n" "  Types:  feat, fix, chore, docs, style, refactor, perf, test, ci, build, revert" >&2
          printf "%s\n" "  Scopes: items, tests, devcontainer, ci, docs, repo, deps" >&2
          exit 1
        fi
        ' -- {1}

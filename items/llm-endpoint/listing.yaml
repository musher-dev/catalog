specVersion: v1
kind: LISTING
metadata:
  slug: llm-endpoint
spec:
  itemType: COMPONENT
  displayName: LLM Endpoint
  summary: >-
    The language model, as a building block other items wire into — an address,
    a key and a model name, chosen once and arriving together.
  description: |
    **LLM Endpoint** stands for a language-model service that runs somewhere
    other than your deployment. It holds one **connection** — an API base URL,
    an API key and a model name, acquired together — and hands those three
    values to whatever is wired into it.

    It runs nothing. There is no container, no compute and no charge for the
    node itself: it is the point in a composition where the model enters.

    ## How it is used

    An application that calls a language model declares three ordinary inputs —
    a base URL, a credential and a model name — and the blueprint wires them to
    this node's three outputs. The install form asks for a language model
    **once**, and defaults to the one your organization already configured, so
    a fresh deployment works without pasting a key into it.

    Because all three values come from one node, and that node takes the
    connection whole, they can never disagree. Replacing the model later
    replaces the endpoint and the credential with it.

    ## When to use it

    - You already pay for a hosted model API and want a chat UI or agent
      builder to use it without pasting the same key into each one.
    - You run your own inference server and want it to stand in for a hosted
      one with nothing else in the composition changing.
    - You want the address and the credential to arrive **together**, so an
      application can never end up holding a key from one provider and an
      address from another.

    ## What it does not do

    **Nothing checks the address.** The platform never connects to it, probes
    it, or confirms that anything answers there — not at install time and not
    afterwards. If the endpoint or key is wrong, the application consuming them
    is the first thing to find out. That is deliberate: a platform that fetched
    an address a user supplied would be one that could be pointed at anything.

    Any service speaking the chat-completions wire protocol works, including an
    inference engine you host yourself.
  category: AI_ML
  lifecycleStage: BETA
  tags:

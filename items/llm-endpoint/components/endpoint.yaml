# A node this platform does not run (component spec §5.6): no image, no compute
# and no address of its own. The values an application needs to reach the
# service arrive as inputs the blueprint supplies, and leave as outputs
# republishing those same inputs. Publishing them from one node is the point: an
# address from one provider beside a credential from another reaches nothing.
#
# SUPERSEDED. ADR 0030 makes a model endpoint, its credential and its model one
# atomic connection, acquired together and overridden whole — which is what this
# component was approximating with three separate values and a convention. A
# blueprint that needs a language model should declare a `connections` parameter
# and bind it through `connectionBindings`, as `open-webui` now does. This item
# is kept, and its listing marked SUNSET, for compositions that still reference
# it; it is not the pattern to copy.
#
# Deliberately vendor-neutral. The address may be a Musher inference endpoint, a
# third-party service, or an engine the customer runs themselves; this document
# cannot tell the difference and must not pretend to. Nothing resolves the
# address, connects to it, or checks that anything answers there (component
# spec §11) — a reachability check against a user-supplied address would be a
# server-side request forgery primitive.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
  description: A language-model API addressed outside this deployment, holding its base URL, credential and model name.
spec:
  type: EXTERNAL
  contract:
    inputs:
      baseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Base URL of the chat-completions API this node addresses. Anything
          speaking the same wire will do; nothing here resolves it or connects
          to it.
      apiKey:
        schema:
          type: string
        sensitive: true
        description: Bearer credential presented to the service above.
      model:
        schema:
          type: string
        required: false
        description: Name the service uses to select which model answers.
    outputs:
      baseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Base URL a consuming workload sends chat-completion requests to. It is
          the value this node was given, republished so a sibling can be pointed
          at the same service.
        from:
          input: baseURL
      apiKey:
        schema:
          type: string
        sensitive: true
        description: >-
          Bearer credential a consuming workload presents to the service above,
          republished from this node's own input.
        from:
          input: apiKey
      model:
        schema:
          type: string
        description: >-
          Model name a consuming workload selects by default, republished from
          this node's own input.
        from:
          input: model

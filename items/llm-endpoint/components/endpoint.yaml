# A node this platform does not run (component spec §5.6): no image, no compute
# and no address of its own. It stands in a composition for the language-model
# API, and the nodes that call the model wire their inputs to its outputs — as
# they would to a managed database's.
#
# The connection enters here and nowhere else (COMP-CONNECTION-002). A workload
# never declares a connection input: it receives the three members as ordinary
# values. That is what makes atomicity structural rather than conventional —
# one connection parameter fills one external node, so its endpoint, credential
# and model always come from one selection, and an address from one provider
# can never sit beside a key from another.
#
# The three outputs forward the members by name (COMP-OUT-004). `apiKey` is
# sensitive because the member is, and sensitivity propagates to anything that
# forwards it.
#
# Deliberately vendor-neutral. The connection may resolve to a Musher inference
# endpoint, a third-party service, or an engine the customer runs themselves;
# this document cannot tell the difference and must not pretend to. Nothing
# resolves the address, connects to it, or checks that anything answers there
# (component spec §11) — a reachability check against a supplied address would
# be a server-side request forgery primitive.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 5
  description: A language-model API addressed outside this deployment, taken whole as one connection — endpoint, credential and model together.
spec:
  type: EXTERNAL
  contract:
    inputs:
      llm:
        description: >-
          Language-model connection this node stands for. The platform acquires
          the endpoint, the credential and the model together, once per
          installation, and replaces them as a whole.
        connection:
          # STREAMING and TOOL_CALLS. Declared by the node that supplies the
          # model rather than by the workload that calls it: after ADR 0033 a
          # worker sees three strings and cannot demand a protocol, so what the
          # composition requires of a connection is stated here, where the
          # blueprint author chooses it.
          #
          # Both are asked for because both consumers in this catalog need
          # them, and a building block that under-declares would be accepted
          # against an endpoint that then fails on an ordinary chat. An item
          # needing less drops them from its own copy.
          protocol: OPENAI_CHAT_COMPLETIONS
          capabilities:
            - STREAMING
            - TOOL_CALLS
    outputs:
      baseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Base URL a consuming workload sends chat-completion requests to, from
          the connection this node was given.
        from:
          input: llm
          member: baseURL
      apiKey:
        schema:
          type: string
        sensitive: true
        description: >-
          Bearer credential a consuming workload presents to the API above,
          from the same connection.
        from:
          input: llm
          member: apiKey
      model:
        schema:
          type: string
        description: >-
          Model the API answers with by default, from the same connection.
        from:
          input: llm
          member: model

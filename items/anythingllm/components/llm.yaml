# The language model AnythingLLM chats and runs its agents with, as a node this
# platform does not run (component spec §5.6). A copy of the `llm-endpoint`
# item's building block: a repo-local componentRef cannot leave its item
# directory, so a blueprint that needs one carries its own.
#
# The connection enters here and nowhere else (COMP-CONNECTION-002). The
# `anythingllm` node declares three ordinary string inputs and the blueprint
# wires them to the three outputs below, so the endpoint, the credential and the
# model always come from one acquired connection rather than three
# independently supplied values.
#
# Nothing resolves the address, connects to it, or checks that anything answers
# there (component spec §11).
specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: The language-model API AnythingLLM sends its chat and agent requests to, taken whole as one connection.
spec:
  type: EXTERNAL
  contract:
    inputs:
      llm:
        description: >-
          Language-model connection AnythingLLM's workspaces and agents run on:
          endpoint, credential and model, acquired together.
        connection:
          # Streaming and tool calls, and both are load-bearing. AnythingLLM's
          # "Generic OpenAI" provider streams every workspace chat
          # (AiProviders/genericOpenAi/index.js, v1.19.0, unless
          # GENERIC_OPENAI_STREAMING_DISABLED). Its agent provider uses native
          # OpenAI tool calling by default and only falls back to prompt-based
          # tools when PROVIDER_DISABLE_NATIVE_TOOL_CALLING names it
          # (agents/aibitat/providers/genericOpenAi.js). Embeddings never reach
          # this API: AnythingLLM embeds locally (components/anythingllm.yaml).
          protocol: OPENAI_CHAT_COMPLETIONS
          capabilities:
            - STREAMING
            - TOOL_CALLS
    outputs:
      baseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Base URL of the OpenAI-compatible API, from the connection this node
          was given.
        from:
          input: llm
          member: baseURL
      apiKey:
        schema:
          type: string
        sensitive: true
        description: Bearer credential for the API above, from the same connection.
        from:
          input: llm
          member: apiKey
      model:
        schema:
          type: string
        description: Model the API answers with by default, from the same connection.
        from:
          input: llm
          member: model

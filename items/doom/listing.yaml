spec:
  itemType: BLUEPRINT
  displayName: Doom
  summary: Play classic Doom in your browser, no install and no extra login
  description: |
    ## What it is
    Chocolate Doom, a faithful source port of the original 1993 Doom,
    running in a streamed Linux desktop that you play from a browser tab.
    Kasm's KasmVNC image renders the game on the server and streams the
    picture over HTTPS, so you play with keyboard and mouse and need no
    plugin. **There is no sound:** KasmVNC's standalone web client does
    not play audio.

    ## When to use
    - You want a quick round of Doom from any machine with a browser.
    - You want a lightweight, shareable demo of a streamed desktop app.

    ## Defaults
    Single-container deployment of `kasmweb/doom:1.19.0` with the KasmVNC
    web client published on port 6901 behind the platform's HTTPS edge.
    **There is no app login:** KasmVNC's own login prompt is disabled.
    Instead, only people signed in to Musher as members of the
    deployment's organization can open the session and play; having the
    URL alone is not enough. An internal VNC password is
    generated automatically; you never need to enter it. Nothing is
    persisted, so save games are lost when the deployment restarts.

    Streaming is tuned for low input lag: up to 60 frames per second,
    with motion streamed at reduced quality and resolution. These
    settings are fixed by the deployment, so the quality controls in the
    in-browser KasmVNC panel have no effect. Click the game to capture
    the mouse for aiming; press Esc to release it.

    The image bundles the shareware Doom episode and Freedoom alongside
    the Chocolate Doom and PrBoom+ engines.

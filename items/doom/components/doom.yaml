specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
  description: >-
    Browser-playable Chocolate Doom via KasmVNC, served over HTTPS with the web
    login disabled and streaming fixed server-side for low input lag.
spec:
  type: SERVICE
  workload:
    source:
      image: kasmweb/doom:1.19.0
    endpoints:
      web:
        targetPort: 6901
        protocol: HTTPS
        tls:
          verify: NONE
    health:
      readiness:
        http:
          endpoint: web
          path: /
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
  contract:
    inputs:
      # Setting VNCOPTIONS replaces the image's own value outright
      # (kasmtech/workspaces-core-images, dockerfile-kasm-core, release/1.19.0),
      # so every flag the session needs is listed here. Each one was checked
      # against kasmweb/doom:1.19.0, which ships KasmVNC 1.5.0, by running the
      # image's own `vncserver -dry-run` and reading the Xvnc command it builds.
      #
      # Flags are written `-Name value`, never `-Name=value`. vncserver appends
      # every kasmvnc_defaults.yaml setting after the flags it is given, unless
      # it sees the bare `-Name` token, and Xvnc keeps the last value. The image's
      # own `-FrameRate=24 -DynamicQualityMin=4 -DynamicQualityMax=7` therefore
      # never took effect: the YAML's 60, 7 and 8 followed and won.
      #
      # -IgnoreClientSettingsKasm makes the server authoritative. Otherwise the
      # web client, which may change settings once the login is disabled, pushes
      # its own "medium" preset on connect, including a 24 fps cap. A client
      # default cannot be set instead: the client reads defaults only from the
      # page URL and its own browser storage. The cost is that the in-browser
      # quality controls do nothing, and the stream stays JPEG/WebP rather
      # than H.264.
      #
      # -FrameRate 60 sends each of Doom's 35 frames a second as soon as it is
      # drawn; at 24 fps a third were dropped and each waited up to ~42 ms.
      # -PreferBandwidth with quality 4-7 is Kasm's intended tuning for the image.
      # -VideoTime 1 switches to whole-frame video encoding after one second of
      # motion rather than five; -MaxVideoResolution 960x540 (still well above
      # Doom's 320x200) and nearest-neighbour -VideoScaling 0 keep that cheap.
      # -ForceGameMode has the client capture the mouse as relative motion on
      # the first click, which Doom's turning needs; Esc releases it.
      vncOptions:
        schema:
          type: string
        default: >-
          -PreferBandwidth -IgnoreClientSettingsKasm -FrameRate 60
          -DynamicQualityMin 4 -DynamicQualityMax 7 -VideoTime 1
          -MaxVideoResolution 960x540 -VideoScaling 0 -ForceGameMode
          -DLP_ClipDelay 0 -disableBasicAuth
        target:
          envVarKey: VNCOPTIONS
        description: >-
          KasmVNC startup options, written as `-Name value`. The defaults fix
          streaming server-side for low input lag (60 fps cap, reduced-quality
          motion) and capture the mouse for aiming. -disableBasicAuth removes
          the HTTP Basic login prompt entirely; who can reach the session is
          decided by the platform's sign-in in front of the endpoint.
      # Kasm's startup still writes this as the underlying VNC password even
      # with the web login disabled, and the image's own default is the
      # public string "vncpassword", so it is supplied rather than left unset.
      vncPassword:
        schema:
          type: string
          minLength: 6
        sensitive: true
        required: true
        target:
          envVarKey: VNC_PW
        description: >-
          Underlying VNC password for the session user kasm_user. Not asked
          for in the browser while the web login is disabled.
    outputs: {}

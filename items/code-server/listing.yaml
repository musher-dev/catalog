specVersion: v2
kind: LISTING
metadata:
  slug: code-server
spec:
  itemType: BLUEPRINT
  displayName: code-server
  summary: VS Code in the browser, running on infrastructure you control
  overview: |
    ## What it is
    code-server runs the full VS Code editor on a remote server and serves
    it to any modern browser. The editor, extensions, terminal, and
    workspace all live on the server — the device you connect from only
    needs a browser.

    ## When to use
    - You want one consistent dev environment reachable from a laptop,
      tablet, or Chromebook with no local toolchain setup.
    - You want to edit and compile on a capable server while working from
      a thin client.
    - You need a disposable, always-on workspace for a project or course
      that outlives any single machine.

    ## Defaults
    Single-container deployment of `codercom/code-server:4.145.2` with the
    web UI published on port 8080 behind the platform's HTTPS edge. There
    is no separate password: opening the editor requires signing in to
    Musher as a member of the deployment's organization, and code-server's
    own login screen is turned off. An 8 GiB persistent volume is mounted
    at `/home/coder`, so projects, extensions, and settings survive
    restarts.

    ## Limitations
    - There is no root in the container. The terminal runs as `coder`, and
      `sudo` fails because every container runs with no-new-privileges, so
      `apt install` isn't available. Install tools without root, under
      `/home/coder`.
    - Every start logs an error from `fixuid` saying it isn't running as
      root. It's harmless: the editor starts normally.
  gettingStarted: |
    1. Open the deployment's URL and sign in to Musher if asked. The editor
       opens straight away, with no separate password.
    2. Keep your projects under `/home/coder`. Everything there survives a
       restart, along with your extensions and settings.
    3. Open a folder from that directory and start working, using the built-in
       terminal for your toolchain. The terminal has no root, so install
       tools under `/home/coder` rather than with `sudo`.

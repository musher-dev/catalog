specVersion: v1
kind: BLUEPRINT
metadata:
  slug: code-server
  revision: 5
  description: code-server behind the platform's sign-in, with a persistent home directory.
spec:
  components:
    web:
      componentRef: ./components/code-server.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 8
      # The platform signs the viewer in before forwarding, and code-server's
      # own password is off (components/code-server.yaml). code-server is
      # browser-only, so blocking non-browser callers costs nothing.
      exposure:
        primary:
          visibility: PUBLIC
          access: AUTHENTICATED
          viewerIdentity: NONE

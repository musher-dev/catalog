specVersion: v1
kind: COMPONENT
metadata:
  revision: 5
  description: code-server, VS Code in the browser, with a persistent home directory.
spec:
  type: SERVICE
  workload:
    source:
      image: codercom/code-server:4.137.0
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /healthz
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
    volumes:
      # The volume must be writable by uid 1000. The image runs as USER 1000
      # (ci/release-image/Dockerfile, v4.137.0), and its entrypoint's
      # `fixuid -q` only remaps and re-owns files when the container runs
      # under a different uid than `coder`'s. It does nothing here, so a volume
      # mounted root-owned stays root-owned, and code-server cannot write
      # ~/.config or ~/.local. That relies on the platform mounting it with
      # group or owner 1000, not on anything this document can state.
      data:
        minSizeGiB: 8
        mountPath: /home/coder
  contract:
    inputs:
      password:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: PASSWORD
        description: Password used to authenticate to the code-server web UI
    outputs: {}

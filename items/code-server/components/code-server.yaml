specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
  description: code-server, VS Code in the browser, with a persistent home directory.
spec:
  type: SERVICE
  workload:
    source:
      image: codercom/code-server:4.130.0
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /healthz
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
    volumes:
      data:
        minSizeGiB: 8
        mountPath: /home/coder
  contract:
    inputs:
      password:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: PASSWORD
        description: Password used to authenticate to the code-server web UI
    outputs: {}

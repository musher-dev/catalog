specVersion: v1
kind: COMPONENT
metadata:
  revision: 6
  description: code-server, VS Code in the browser, with a persistent home directory.
spec:
  type: SERVICE
  workload:
    source:
      image: codercom/code-server:4.139.1
    # code-server's own password screen is turned off: the blueprint exposes
    # `primary` with `access: AUTHENTICATED`, so the platform signs the viewer
    # in before forwarding, and the container is reachable only through that
    # edge. A second password would only be a credential to copy around.
    # The image's ENTRYPOINT is `entrypoint.sh --bind-addr 0.0.0.0:8080 .`
    # with no CMD, and entrypoint.sh ends `exec dumb-init /usr/bin/code-server
    # "$@"` (ci/release-image/, v4.139.1), so these arguments are appended
    # after the ENTRYPOINT's. The flag outranks the `auth: password` that
    # code-server writes to ~/.config/code-server/config.yaml on first start,
    # which persists on the volume: setDefaults merges
    # `Object.assign({}, configArgs, cliArgs)` (src/node/cli.ts, v4.139.1).
    # /healthz is mounted outside the auth check either way
    # (src/node/routes/index.ts, v4.139.1).
    command:
      - --auth
      - none
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /healthz
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
    volumes:
      # The volume must be writable by uid 1000. The image runs as USER 1000
      # (ci/release-image/Dockerfile, v4.139.1), and its entrypoint's
      # `fixuid -q` only remaps and re-owns files when the container runs
      # under a different uid than `coder`'s. It does nothing here, so a volume
      # mounted root-owned stays root-owned, and code-server cannot write
      # ~/.config or ~/.local. That relies on the platform mounting it with
      # group or owner 1000, not on anything this document can state.
      data:
        minSizeGiB: 8
        mountPath: /home/coder
  contract:
    inputs: {}
    outputs: {}

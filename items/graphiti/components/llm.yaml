# The language model Graphiti extracts entities and facts with, as a node this
# platform does not run (component spec §5.6). Modelled on the `llm-endpoint`
# item's building block: a repo-local componentRef cannot leave its item
# directory, so a blueprint that needs one carries its own.
#
# The connection enters here and nowhere else (COMP-CONNECTION-002). The `mcp`
# node declares three ordinary string inputs and the blueprint wires them to
# the three outputs below, so the endpoint, the credential and the model always
# come from one acquired connection rather than three independently supplied
# values.
#
# Nothing resolves the address, connects to it, or checks that anything answers
# there (component spec §11).
specVersion: v2
kind: COMPONENT
metadata:
  revision: 1
  description: >-
    The OpenAI-compatible chat-completions API Graphiti sends its extraction
    and deduplication prompts to, taken whole as one connection.
spec:
  type: EXTERNAL
  contract:
    inputs:
      llm:
        description: >-
          Language-model connection Graphiti builds the knowledge graph with:
          endpoint, credential and model, acquired together.
        connection:
          # OPENAI_CHAT_COMPLETIONS, Graphiti's documented route for any
          # OpenAI-compatible endpoint (mcp_server/README.md, "Using Ollama for
          # Local LLM", mcp-v1.1.3). A base URL off api.openai.com selects its
          # generic client, which calls POST {baseURL}/chat/completions and
          # asks for JSON with `response_format` (openai_generic_client.py,
          # graphiti-core v0.31.2). It neither streams nor calls tools, so no
          # capability is required.
          #
          # Not ANTHROPIC_MESSAGES, although Graphiti has an Anthropic client:
          # that client always passes `temperature` to messages.create
          # (anthropic_client.py, v0.31.2), an argument the Anthropic SDK
          # dropped in 1.0, and the image resolves anthropic 1.16.0 (the uv.lock
          # regenerated in the image, mcp-v1.1.3). Every episode then fails
          # with "AsyncMessages.create() got an unexpected keyword argument
          # 'temperature'" (seen in a live deploy test, 2026-11).
          #
          # This is declared on the supplying node rather than on `mcp`: after
          # ADR 0033 a workload sees three strings and cannot demand a protocol.
          protocol: OPENAI_CHAT_COMPLETIONS
    outputs:
      baseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Base URL of the OpenAI-compatible chat-completions API, from the
          connection this node was given.
        from:
          input: llm
          member: baseURL
      apiKey:
        schema:
          type: string
        sensitive: true
        description: Bearer credential for the API above, from the same connection.
        from:
          input: llm
          member: apiKey
      model:
        schema:
          type: string
        description: Model Graphiti sends every prompt to, from the same connection.
        from:
          input: llm
          member: model

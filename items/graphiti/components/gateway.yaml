# Adapted from the `firecrawl` item's gateway (items/firecrawl/components/
# gateway.yaml): the same Caddy key check, in front of an MCP
# server rather than a REST API.
specVersion: v2
kind: COMPONENT
metadata:
  revision: 2
  description: >-
    Caddy reverse proxy that admits only requests carrying the deployment's
    API key as a bearer token, in front of an MCP server that checks none.
spec:
  type: SERVICE
  workload:
    source:
      # PINNED. 2.11.9 is the latest stable Caddy release (2026-11-05).
      image: caddy:2.11.9-alpine
    # Why this node exists: Graphiti's MCP server has no authentication
    # (src/graphiti_mcp_server.py, mcp-v1.1.3, builds MCPServer with no auth
    # settings), and anyone who reaches it can read, add to and clear the
    # whole graph. The platform's sign-in does not fit MCP clients, which hold
    # no viewer session, and its BEARER exemption lets any bearer token
    # through unchecked (blueprint v2 BP-ACCESS-010). So Caddy compares the
    # token itself. MCP clients such as Claude Code, Cursor and VS Code can
    # send a fixed `Authorization` header to a remote server.
    #
    # The image has no ENTRYPOINT, so `command` is the whole argv. A shell
    # writes the Caddyfile, since a component cannot ship a file. The
    # heredoc is quoted, so the shell expands nothing and the key never
    # reaches argv or the file: Caddy replaces {$MCP_API_KEY} and
    # {$MCP_UPSTREAM} from the environment when it parses the file, before
    # tokenising it (caddyserver.com/docs/caddyfile/concepts, "Environment
    # variables").
    #
    # - The header matcher compares the whole Authorization value, so only
    #   `Bearer <key>` exactly passes.
    # - reverse_proxy flushes text/event-stream responses as they arrive, so
    #   streamable HTTP's SSE replies and the GET notification stream pass
    #   through unbuffered, and the Mcp-Session-Id header is forwarded both
    #   ways like any other.
    # - Everything else gets a 401. No CORS preflight is let through:
    #   Graphiti answers none, and its clients are not browsers.
    # - `admin off` leaves no admin API listening; `auto_https off` because
    #   the platform's edge terminates TLS. Caddy writes no access log
    #   unless told to, so keys are never logged.
    #
    # WORKAROUND(platform-api#1447): Caddy takes its configuration from a
    #   file, which a component cannot mount, so the shell writes it.
    command:
      - sh
      - -c
      - |
        cat > /tmp/Caddyfile <<'EOF'
        {
          admin off
          auto_https off
          persist_config off
        }

        :8080 {
          @key header Authorization "Bearer {$MCP_API_KEY}"
          handle @key {
            reverse_proxy {$MCP_UPSTREAM}
          }

          handle {
            header Content-Type application/json
            header WWW-Authenticate Bearer
            respond `{"error":"Unauthorized: missing or invalid API key"}` 401
          }
        }
        EOF
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      # Sent with the key, so the probe passes the gate and reaches the MCP
      # server's /health through the proxy: a 200 proves Caddy, the key check
      # and the upstream together. Until the server answers, Caddy returns
      # 502 and this node stays unready.
      readiness:
        http:
          endpoint: primary
          path: /health
          auth:
            bearer:
              token:
                input: apiKey
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
  contract:
    inputs:
      # The alphabet HEX, BASE64 and BASE64URL share. None of it is Caddyfile
      # syntax, so no quote, brace, space or backtick can end the quoted token
      # the key is substituted into.
      apiKey:
        schema:
          type: string
          minLength: 32
          pattern: ^[A-Za-z0-9._~+/=-]+$
        sensitive: true
        required: true
        target:
          envVar: MCP_API_KEY
        description: >-
          API key every MCP client must send as `Authorization: Bearer <key>`;
          copy it from the deployment's Installation tab.
      upstream:
        schema:
          type: string
        required: true
        target:
          envVar: MCP_UPSTREAM
        description: Mesh-internal `host:port` of the MCP server the gateway forwards to.
    outputs:
      publicURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: Public https base URL of the gateway; MCP clients connect to it at /mcp.
        from:
          endpoint: primary
          property: publicURL
      mcpURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: Public streamable-HTTP URL to give an MCP client, with the API key as a bearer token.
        from:
          template: "${{ self.endpoints.primary.publicURL }}/mcp"
      privateURL:
        schema:
          type: string
        description: >-
          Mesh-internal base URL of the gateway, for workloads in the same
          deployment; they too must send the key.
        from:
          template: "http://${{ self.endpoints.primary.privateAddress }}"

specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: qdrant/qdrant:v1.18.3
    endpoints:
      primary:
        containerPort: 6333
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /healthz
        endpoint: primary
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
    volumes:
      data:
        sizeGiB: 8
        mountPath: /qdrant/storage
  contract:
    inputs:
      apiKey:
        schema:
          type: STRING
          sensitive: true
        required: true
        suppliedBy: USER
        ui:
          label: API key
        target:
          envVarKey: QDRANT__SERVICE__API_KEY
        generator:
          byteLength: 32
          encoding: ALPHANUMERIC
        description: Auto-generated bearer token required by clients to authenticate
          against the Qdrant HTTP API
    outputs: {}

specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
  description: Qdrant vector database serving its HTTP API from one storage volume.
spec:
  type: SERVICE
  workload:
    source:
      image: qdrant/qdrant:v1.18.3
    endpoints:
      primary:
        targetPort: 6333
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /healthz
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
    volumes:
      data:
        minSizeGiB: 8
        mountPath: /qdrant/storage
  contract:
    inputs:
      apiKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: QDRANT__SERVICE__API_KEY
        description: Bearer token required by clients to authenticate against the
          Qdrant HTTP API
    outputs: {}

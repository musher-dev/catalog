specVersion: v2
kind: BLUEPRINT
metadata:
  slug: qdrant
  revision: 9
  description: Qdrant vector database with an authenticated, publicly reachable HTTP API.
spec:
  nodes:
    web:
      componentRef: ./components/qdrant.yaml
      # Qdrant's own free cloud tier runs on 1 GB of RAM, and it sizes its
      # thread pools from the container's CPU quota. Vectors stay in RAM by
      # default, which bounds a trial collection to well under a million.
      compute:
        profile: general.economy.nano
      volumes:
        data:
          sizeGiB: 8
      exposure:
        primary: PUBLIC
      bindings:
        apiKey:
          parameter: apiKey
  parameters:
    apiKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: API key

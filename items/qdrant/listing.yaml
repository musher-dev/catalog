specVersion: v2
kind: LISTING
metadata:
  slug: qdrant
spec:
  itemType: BLUEPRINT
  displayName: Qdrant
  summary: Rust vector database for similarity search and RAG retrieval on CPU hardware
  overview: |
    ## What it is
    Qdrant is an open-source vector database written in Rust. It serves
    similarity search, recommendation, and RAG retrieval workloads at
    production latencies on commodity CPU hardware — no GPU required —
    with payload filtering built into the query engine.

    ## When to use
    - You're building a RAG pipeline and want a dedicated vector store
      rather than bolting pgvector onto an existing Postgres.
    - You need filtered vector search with payload metadata at low
      latency.
    - You're serving embedding-based recommendations or semantic search
      from your own infrastructure.

    ## Defaults
    Single-container deployment of `qdrant/qdrant:v1.20.0` with the HTTP
    API on port 6333 behind the platform's HTTPS edge; the gRPC port 6334
    exists in Qdrant but is not exposed by this listing. Clients
    authenticate with an auto-generated API key — copy or rotate it from
    the deployment's Installation tab. An 8 GiB persistent volume
    mounted at `/qdrant/storage` keeps collections and vectors across
    restarts.

    ## Dashboard
    The deployment URL is the API root, not a web page — opening it returns
    Qdrant's JSON version banner. The bundled Web UI is served at
    `/dashboard`: append that path to the deployment URL to browse
    collections, inspect points, and run queries from the browser. Paste the
    deployment's API key into the dashboard's key field before it can read
    anything.
  gettingStarted: |
    1. Copy the **API key** from the deployment's Installation tab.
    2. Add `/dashboard` to the deployment's URL and paste the key into the
       dashboard's key field. The URL on its own only returns Qdrant's JSON
       version banner.
    3. Point your application at the deployment's URL over HTTP, sending the key
       with each request. The gRPC port is not exposed.
    4. Create a collection and upload your first vectors.
  category: DATABASES
  lifecycleStage: STABLE
  tags:

specVersion: v2
kind: BLUEPRINT
metadata:
  slug: hermes-agent
  revision: 4
  description: >-
    Hermes Agent gateway and web dashboard on the deployer's language-model
    connection, with Hindsight as long-term memory on its own PostgreSQL, and
    the dashboard signed in through the platform's OpenID Connect provider and
    Hindsight's memory UI behind the platform's sign-in.
spec:
  nodes:
    llm:
      componentRef: ./components/llm.yaml
      # No compute, no volumes, no exposure: an EXTERNAL node runs nothing
      # (BP-NODE-002). It stands for the model API and publishes the three
      # members of the one connection it is given.
      bindings:
        llm:
          parameter: llm
    memory-db:
      componentRef: ./components/pgvector.yaml
      # Hindsight's guide gives PostgreSQL 512 MB to 1 GB
      # (hindsight-docs/docs/developer/installation.md, v1.2.0), and one
      # agent's memory banks are small.
      compute:
        profile: general.economy.nano
      volumes:
        data:
          sizeGiB: 10
      # No exposure: the database stays PRIVATE, reachable only inside this
      # deployment through the address it publishes.
      bindings:
        postgresPassword:
          parameter: memoryDBPassword
        postgresUser:
          value: hindsight
        postgresDb:
          value: hindsight
    memory:
      componentRef: ./components/hindsight.yaml
      # Not standard.nano, although upstream asks for 1.5 GB and recommends
      # 2 GB (hindsight-docs/docs/developer/installation.md). That table assumes
      # a ~90 MB MiniLM reranker, and v1.2.0 loads hindsight-ai/hs-rerank-1, a
      # 114M-parameter float32 model, beside bge-small-en-v1.5, both on CPU
      # PyTorch (config.py). Retain and recall then run near 2 GiB, and the
      # memory limit is a hard one.
      compute:
        profile: general.standard.small
      # No exposure: only the agent and `memory-ui` reach the memory API.
      bindings:
        apiKey:
          parameter: memoryAPIKey
        # The same generated password the `memory-db` node initialises its
        # role with, and the same role and database names.
        pgAddress:
          node: memory-db
          output: address
        pgUser:
          value: hindsight
        pgPassword:
          parameter: memoryDBPassword
        pgDatabase:
          value: hindsight
        # The same connection the agent runs on, from the same node.
        llmBaseURL:
          node: llm
          output: baseURL
        llmAPIKey:
          node: llm
          output: apiKey
        llmModel:
          node: llm
          output: model
    memory-ui:
      componentRef: ./components/hindsight-control-plane.yaml
      # A Next.js server; upstream gives it 128 MB, 256 MB recommended
      # (hindsight-docs/docs/developer/installation.md).
      compute:
        profile: general.economy.nano
      # Signed in, no identity forwarded. The UI has no accounts of its own,
      # only an optional shared key this item leaves unset, and whoever reaches
      # it acts with the API key: browsing, editing and deleting memories, and
      # running recall and reflect on the deployer's model. So the platform
      # admits only viewers its access policy allows, and no path is exempt.
      exposure:
        primary:
          visibility: PUBLIC
          access: RESTRICTED
          viewerIdentity: NONE
      bindings:
        dataplaneAPIURL:
          node: memory
          output: apiURL
        dataplaneAPIKey:
          parameter: memoryAPIKey
    web:
      componentRef: ./components/hermes-agent.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 10
      # Signed in, never path-exempt: the dashboard stores API keys and
      # messaging tokens and can start agent turns that run shell commands.
      # The platform admits only viewers its access policy allows, and Hermes
      # then signs the same viewer in as an OpenID Connect client of the
      # platform (BP-ACCESS-008). The platform issues a code only to an
      # authorized viewer, and it already holds the viewer's session, so this
      # adds a redirect rather than a second password. The email and name are
      # released so the dashboard can show who is signed in.
      #
      # The gateway's OpenAI-compatible API server is not exposed: a component
      # can have only one public HTTP endpoint, the one its readiness probe
      # polls (components/hermes-agent.yaml).
      exposure:
        primary:
          visibility: PUBLIC
          access: RESTRICTED
          viewerIdentity: OIDC
          viewerClaims:
            - EMAIL
            - NAME
      bindings:
        # This node's own allocated address and OIDC client, from the outputs
        # the component derives from its `primary` endpoint. A node reading its
        # own endpoint outputs is a discovery dependency and not a value cycle
        # (BP-BIND-002): the address and the client registration exist before
        # anything runs.
        dashboardPublicURL:
          node: web
          output: publicURL
        oidcIssuerURL:
          node: web
          output: oidcIssuerURL
        oidcClientID:
          node: web
          output: oidcClientID
        oidcClientSecret:
          node: web
          output: oidcClientSecret
        # The three members of the one connection the `llm` node holds. Wiring
        # them from one node is what keeps them consistent: an address from one
        # provider beside a key from another would have to be written here, in
        # the open, rather than assembled silently.
        llmBaseURL:
          node: llm
          output: baseURL
        llmAPIKey:
          node: llm
          output: apiKey
        llmModel:
          node: llm
          output: model
        # Long-term memory: the `memory` node's private URL and the key it
        # checks. The boot command selects Hindsight when the URL is present.
        hindsightAPIURL:
          node: memory
          output: apiURL
        hindsightAPIKey:
          parameter: memoryAPIKey
  parameters:
    # The language model the agent runs on: endpoint, credential and model
    # acquired together as one connection, defaulting to the organization's. A
    # connection parameter binds only to a connection input, and the `llm`
    # node's is the only one here (BP-CONNECTION-001).
    llm:
      from: "${{ connections.llm.default }}"
      ui:
        label: Language model
        order: 1
    # Shared by the agent, Hindsight and its memory UI, and needed by nobody
    # else, so it is not disclosed.
    memoryAPIKey:
      generator:
        byteLength: 32
        encoding: HEX
    # HEX, not BASE64: the password is placed in the database URL unencoded,
    # and hex needs no percent-encoding there. Disclosed to whoever manages the
    # deployment, for direct database access and backups.
    memoryDBPassword:
      generator:
        byteLength: 24
        encoding: HEX
      ui:
        label: Memory database password
        order: 2

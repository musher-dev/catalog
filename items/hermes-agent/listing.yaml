metadata:
  slug: hermes-agent
spec:
  itemType: BLUEPRINT
  displayName: Hermes Agent
  summary: >-
    Nous Research's self-improving AI agent, with long-term Hindsight memory, a
    web dashboard and a messaging gateway, running on your organization's
    language model
  overview: |
    ## What it is
    Hermes Agent, from Nous Research, is an open-source agent that keeps
    memory across sessions and writes its own reusable skills as it works.
    It has a terminal-style chat, scheduled jobs and tool use. A long-running
    gateway connects it to messaging apps such as Telegram, Discord and Slack.
    This deployment runs the gateway together with Hermes's web dashboard,
    where you chat with the agent and manage its configuration, keys,
    sessions, skills and channels. Hindsight runs beside it as the agent's
    long-term memory.

    ## When to use
    - You want a persistent agent on infrastructure you control, reachable
      from a browser and from the messaging apps you already use.
    - You want an agent that runs scheduled jobs and keeps learning between
      conversations, not a chat tab that forgets.
    - You want to set the agent up, chat with it and watch what it does from
      a browser, without a terminal on the host.

    ## What you'll be asked for
    A **language model**, chosen once. It defaults to your organization's
    model connection. The address, the credential and the model name travel
    together as a single connection. Anything speaking the OpenAI
    chat-completions protocol with streaming and tool calls will do,
    including an engine you run yourself.

    The connection is written into Hermes's configuration each time it
    starts, so a replaced connection takes effect on the next restart. For
    the same reason, a different main model picked in the dashboard reverts
    to the connection's model on restart. The credential itself is read from
    the deployment's environment and is not written to Hermes's configuration.
    The agent's shell commands can read it, and Hermes's terminal snapshots
    under `/opt/data/cache/terminal` can hold a copy, so treat the data volume
    as sensitive.

    ## Defaults
    A single container runs `nousresearch/hermes-agent:v0.23.0` with the
    dashboard on port 9119, behind the platform's HTTPS edge and sign-in. The
    messaging gateway runs beside it, supervised so that a crash restarts the
    gateway, not the container. No messaging channel is connected at first.
    Add Telegram, Discord, Slack or another channel on the dashboard's
    **Channels** page and restart the gateway from there.

    Hermes's OpenAI-compatible API server is not exposed. It stays on the
    container's loopback interface, where the dashboard uses it, and other
    apps cannot call it. Hermes's browser Webapp, which serves the Desktop
    workspace on its own port, stays off and is not exposed either.

    A 10 GiB volume at `/opt/data` keeps configuration, saved keys and
    channel tokens, sessions, built-in memories, skills, cron jobs and logs
    across restarts. The agent's shell commands run inside this container.

    ## Long-term memory
    Hindsight stores what the agent learns as a knowledge graph. After each
    turn Hermes sends the conversation to it, and before the next turn it
    recalls what is relevant. The agent also gets tools to retain, recall and
    reflect on memories. Hermes's built-in memory keeps working alongside it.

    Two more containers run for this, and only this deployment can reach
    them. One runs `ghcr.io/vectorize-io/hindsight-api:1.2.0`, with its
    embedding and reranking models built in. The other is a PostgreSQL 17
    server with pgvector on its own 10 GiB volume. Its password is generated
    for you, and you can reveal it on the deployment's Installation tab.

    ## Memory UI
    A fourth container runs Hindsight's Control Plane
    (`ghcr.io/vectorize-io/hindsight-control-plane:1.2.0`), a web UI for what
    the agent remembers. It has its own address, listed with the deployment's
    endpoints, behind the same Musher sign-in as the dashboard. There you can
    browse memory banks, documents, entities and the knowledge graph, and try
    recall and reflect against a bank. The UI calls the memory API from its
    own server, so the API itself stays private.

    The memory UI has full control of the agent's memory. Whoever it admits
    can edit and delete memories and banks, and recall, reflect and retain
    there run on your language model like the agent's own memory processing.

    Hindsight processes memories on the language model you chose, so expect
    extra model usage on every turn. The model must support JSON-schema
    structured output, or reflecting on memories fails. Memory processing sends
    your conversations to that model and nowhere else.

    Hermes downloads its Hindsight plugin from GitHub the first time it
    starts, and later upgrades leave the plugin where it is. If the download
    fails, the agent runs on its built-in memory and retries at the next
    restart. Hindsight is written into Hermes's configuration each time it
    starts, so a different memory provider picked in the dashboard reverts on
    restart.

    ## Access and security
    Signing in to Musher is what gets you in. The platform admits only people
    its access policy allows for this deployment. Hermes then signs you in
    through the platform as well, which normally happens without a prompt.
    When a dashboard session expires, Hermes may show its own sign-in page
    with a single button.

    Everyone the platform admits has full control of the agent. That includes
    the keys and channel tokens saved in the dashboard, and an agent that can
    run shell commands in the container and reach the network. Limit who can
    open the deployment accordingly. Upstream recommends never exposing this
    dashboard without authentication. Here it is never reachable without
    signing in.

    Channels that connect outward, such as Telegram, Discord and Slack, need
    no extra exposure. Channels that wait for inbound webhooks, such as
    Microsoft Teams or Hermes's generic webhook endpoint, cannot be reached,
    because only the dashboard and the memory UI are exposed. Each connected channel lets the
    people it allows talk to the agent. Use the channel's allowlist or the
    dashboard's **Pairing** page to control who that is.
  gettingStarted: |
    1. Open the deployment's URL and sign in to Musher. Hermes signs you in
       through the platform too, and the agent is already on the language model
       you chose.
    2. Chat with the agent from the dashboard to confirm it answers.
    3. To reach it from a messaging app, add Telegram, Discord, Slack or another
       outbound channel on the **Channels** page, then restart the gateway from
       there.
    4. Use the channel's allowlist or the **Pairing** page to control who can
       talk to the agent.
    5. After a few turns, open the `memory-ui` endpoint to see what Hindsight
       has learned, in the bank Hermes writes to.

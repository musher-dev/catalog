specVersion: v1
kind: LISTING
metadata:
  slug: litellm
spec:
  itemType: BLUEPRINT
  displayName: LiteLLM
  summary: OpenAI-compatible proxy that fronts 100+ LLM providers with keys, budgets, and logging
  description: |
    ## What it is
    LiteLLM is an OpenAI-compatible proxy that fronts 100+ LLM providers
    (OpenAI, Anthropic, Bedrock, Vertex, Mistral, Azure, local Ollama)
    behind one API. Add virtual API keys, per-key budgets, rate limits,
    request logging, and streaming routing without rewriting your
    application.

    ## When to use
    - You want a single OpenAI-compatible endpoint that swaps providers
      without changing client code.
    - You need centralized API-key management, spend tracking, and
      per-team budgets across multiple LLM vendors.
    - You want provider fallbacks and load balancing in front of your
      model traffic.

    ## Defaults
    Single-container deployment of
    `ghcr.io/berriai/litellm:v1.83.14-stable.patch.3` with the proxy on
    port 4000 behind the platform's HTTPS edge. A master key is
    auto-generated and is required for admin endpoints. Copy it from the
    deployment's Configuration tab and present it exactly as shown.

    ## Limitations
    This deployment runs stateless: no database, no persistent volume and
    no config file. LiteLLM registers models either from a config file or,
    with a database, from the dashboard, and this build has neither. As
    deployed, it answers health checks and authenticates the master key but
    **serves no models**. Virtual keys, teams, budgets and spend tracking
    need the database-backed build this catalog does not ship yet
    ([catalog#16](https://github.com/musher-dev/catalog/issues/16)).
  category: AI_ML

specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
  description: LiteLLM proxy exposing one OpenAI-compatible API in front of many model providers.
spec:
  type: SERVICE
  workload:
    source:
      image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.3
    endpoints:
      primary:
        targetPort: 4000
        protocol: HTTP
    health:
      readiness:
        # /health/liveliness (LiteLLM's spelling) is the pure unauthenticated
        # alive signal; /health/readiness is DB/cache-coupled (proxy/health docs).
        http:
          endpoint: primary
          path: /health/liveliness
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
  contract:
    inputs:
      masterKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: LITELLM_MASTER_KEY
        description: Admin token for the proxy API. The 'sk-' prefix is added
          automatically by LiteLLM
    outputs: {}

specVersion: v1
kind: COMPONENT
metadata:
  revision: 4
  description: LiteLLM proxy exposing one OpenAI-compatible API in front of many model providers.
spec:
  type: SERVICE
  workload:
    source:
      image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.3
    endpoints:
      primary:
        targetPort: 4000
        protocol: HTTP
    health:
      readiness:
        # /health/liveliness (LiteLLM's spelling) is the pure unauthenticated
        # alive signal; /health/readiness is DB/cache-coupled (proxy/health docs).
        http:
          endpoint: primary
          path: /health/liveliness
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
  contract:
    inputs:
      masterKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: LITELLM_MASTER_KEY
        # Presented exactly as generated. v1.83.14-stable.patch.3 compares it
        # to the request's key with secrets.compare_digest
        # (proxy/auth/user_api_key_auth.py) and adds no prefix. The "must start
        # with sk-" assertion there applies only to virtual keys, which this
        # database-less build cannot issue anyway.
        description: >-
          Admin token for the proxy API and dashboard, presented exactly as
          generated.
    outputs: {}

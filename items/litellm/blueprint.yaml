specVersion: v1
kind: BLUEPRINT
metadata:
  slug: litellm
  revision: 3
  description: LiteLLM proxy with a generated master key, reachable over a public HTTP API.
spec:
  components:
    web:
      componentRef: ./components/litellm.yaml
      compute:
        profile: general.economy.nano
      exposure:
        primary: PUBLIC
      bindings:
        masterKey:
          parameter: masterKey
  parameters:
    masterKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Master key

specVersion: v2
kind: BLUEPRINT
metadata:
  slug: litellm-stack
  revision: 5
  description: >-
    LiteLLM proxy with its own Postgres for virtual keys, teams and spend, and
    its own password-protected Redis for shared cache and rate limits.
# Three nodes. Producers first: map order is graph order, and the two nodes the
# wires come from read before the node they arrive at.
spec:
  nodes:
    db:
      componentRef: ./components/postgres.yaml
      # PostgreSQL's defaults are fixed (128 MB shared_buffers), not sized from
      # the machine, so one trial deployment's database fits in 1 GiB.
      compute:
        profile: general.economy.nano
      volumes:
        data:
          sizeGiB: 10
      # No exposure: PRIVATE, reachable only from this deployment.
      bindings:
        postgresPassword:
          parameter: databasePassword
        postgresUser:
          value: litellm
        postgresDb:
          value: litellm
    cache:
      componentRef: ./components/redis.yaml
      # Single-threaded, a few megabytes when empty, and holding only a
      # trial's rate-limit counters and cached responses.
      compute:
        profile: general.economy.nano
      volumes:
        data:
          sizeGiB: 5
      # No exposure: PRIVATE, like `db`, and behind a password as well.
      bindings:
        redisPassword:
          parameter: cachePassword
    web:
      componentRef: ./components/litellm.yaml
      # One notch above the single-container `litellm` item's
      # general.economy.nano: importing the proxy takes about 560 MiB, and the
      # Prisma migrations on first boot peak near 630 MiB (BerriAI/litellm
      # #47076), which leaves too little of 1 GiB for the key lookups and spend
      # writes every request carries. One worker by default (NUM_WORKERS), not
      # one per core.
      compute:
        profile: general.standard.nano
      # PUBLIC, not behind the platform's sign-in. Its callers are API
      # clients holding a LiteLLM key, and none of them holds a viewer session.
      exposure:
        primary: PUBLIC
      bindings:
        masterKey:
          parameter: masterKey
        saltKey:
          parameter: saltKey
        # The role and database `db` is initialised with, and one generated
        # password shared by both ends: one parameter, so the two always agree.
        databaseHost:
          node: db
          output: address
        databaseUsername:
          value: litellm
        databasePassword:
          parameter: databasePassword
        databaseName:
          value: litellm
        # The cache's hostname and port, and the same generated password the
        # `cache` node starts Redis with: one parameter, as with the database.
        redisHost:
          node: cache
          output: hostname
        redisPort:
          node: cache
          output: port
        redisPassword:
          parameter: cachePassword
  parameters:
    masterKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Master key
        order: 1
    saltKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Salt key
        order: 2
    databasePassword:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Database password
        order: 3
    # HEX, because Redis reads the password as one word of its configuration.
    cachePassword:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Cache password
        order: 4

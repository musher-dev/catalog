metadata:
  slug: paperclip
spec:
  itemType: BLUEPRINT
  displayName: Paperclip
  summary: Run a team of AI agents like a company — org chart, tickets, budgets and approval gates in one control plane
  overview: |
    ## What it is
    Paperclip is an open-source control plane for teams of AI agents. You
    hire agents into an org chart with roles and reporting lines, hand them
    work as tickets that carry goal context, wake them on a heartbeat
    schedule, cap each one's spend with a budget, and approve risky actions
    before they happen, all with an audit trail. It drives Claude Code,
    Codex, OpenCode, Gemini and Hermes agents, and OpenClaw gateways, from
    one board.

    ## When to use
    - You run several coding or operations agents and want one place to
      assign, supervise and pay for their work.
    - You want spending limits and human approval gates in front of what
      agents do, not just a chat window.
    - You already use OpenClaw or Hermes and want them to work as managed
      employees alongside Claude Code agents.

    ## What you'll be asked for
    A **language model**, chosen once. It defaults to your organization's
    model connection, and must speak the Anthropic Messages API with streaming
    and tool calls. The address, the credential and the model travel together
    as a single connection. It is what agents using the built-in **Claude
    Code** adapter run on. Codex, Gemini and other adapters take their own
    credentials, which you add in Paperclip. The connection is read at every
    start, so rotating your organization's credential reaches the deployment
    on its next restart.

    ## Defaults
    Two containers. The first runs `ghcr.io/paperclipai/paperclip:2026.1023.0`
    with the board UI and API on port 3100, behind the platform's HTTPS edge and
    sign-in. The second is a private PostgreSQL 17 server that only Paperclip
    can reach.

    Paperclip also keeps its own accounts. After the platform signs you in,
    create a Paperclip account and choose **Claim this instance** to become its
    admin. Do this right after deploying: the first person to claim it owns it.

    Requests carrying a bearer token are passed through for Paperclip to
    check, and so are signed routine-trigger webhooks. Bearer tokens come from
    the `paperclipai` CLI, board API keys and remote agent gateways.

    Session, agent-token and approval-signing keys are generated for you, and
    so is the database password, which you can reveal on the deployment's
    Installation tab. A 20 GiB volume at `/paperclip` keeps agent workspaces,
    uploads and the master key for encrypted secrets. Back that key up along
    with the database, because secrets can't be decrypted without it. A 10 GiB
    volume holds the database.

    Paperclip runs on 4 vCPU and 8 GiB of memory, because agent runs start
    CLIs, git and build tools inside the same container.
  gettingStarted: |
    1. Do this right after deploying: open the deployment's URL, sign in to
       Musher, create a Paperclip account and choose **Claim this instance**.
       The first person to claim it owns it.
    2. Hire your first agent into the org chart. The **Claude Code** adapter
       runs on the language model you chose, and other adapters need their own
       credentials, which you add in Paperclip.
    3. Give the agent a budget and a first ticket, and turn on approvals for
       anything risky. If Paperclip can't price your model, a budget holds the
       agent: on the **Budgets** tab of **Costs**, clear **Block new work when
       usage has no reliable price** under that budget's **Advanced settings**.
    4. Plan backups of the database and of the master key on the `/paperclip`
       volume. Secrets can't be decrypted without that key.

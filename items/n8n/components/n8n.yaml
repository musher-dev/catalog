specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: n8nio/n8n:2.31.6
    endpoints:
      primary:
        containerPort: 5678
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        # /healthz/readiness answers 200 only once the DB is connected and
        # migrated; bare /healthz answers as soon as the process is reachable,
        # which would declare readiness before n8n can serve traffic
        # (docs.n8n.io monitor-n8n).
        path: /healthz/readiness
        endpoint: primary
        # n8n runs DB migrations before it becomes ready on a nano profile, so
        # give the startup gate generous runway. With the agent's startup-probe
        # fix, non-200s during boot count as "not ready yet" (never a kill);
        # the effective budget is initial_delay + (success + failure + 30)
        # attempts at 1s.
        initialDelaySeconds: 45
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    envVars:
      # n8n builds webhook URLs from N8N_PROTOCOL + N8N_HOST; the platform
      # fronts every public endpoint with HTTPS, so pin the protocol.
      - key: N8N_PROTOCOL
        value:
          type: LITERAL
          value: https
      # One TLS-terminating proxy hop (the gateway) sits in front of n8n; this
      # makes n8n trust X-Forwarded-* from it (docs.n8n.io
      # configure-webhook-urls-with-reverse-proxy).
      - key: N8N_PROXY_HOPS
        value:
          type: LITERAL
          value: '1'
    volumes:
      data:
        sizeGiB: 4
        mountPath: /home/node/.n8n
  contract:
    inputs:
      n8nHost:
        schema:
          type: STRING
          format: HOSTNAME
        required: false
        target:
          envVarKey: N8N_HOST
        description: >-
          Public hostname n8n uses for webhook URLs. Override only for a custom
          domain.
      webhookUrl:
        schema:
          type: STRING
          format: ENDPOINT_URL
        required: false
        target:
          envVarKey: WEBHOOK_URL
        description: >-
          Full public base URL n8n registers webhooks under. Without it n8n
          composes protocol://host:port and leaks the internal container port
          into webhook URLs behind the TLS-terminating gateway. Override only
          for a custom domain.
      editorBaseUrl:
        schema:
          type: STRING
          format: ENDPOINT_URL
        required: false
        target:
          envVarKey: N8N_EDITOR_BASE_URL
        description: >-
          Public URL of the n8n editor, used in emails and OAuth/SAML redirects.
          Override only for a custom domain.
      timezone:
        schema:
          type: STRING
          format: TIMEZONE
          default: UTC
        required: false
        target:
          envVarKey: GENERIC_TIMEZONE
        description: IANA timezone for scheduled workflows
    outputs: {}

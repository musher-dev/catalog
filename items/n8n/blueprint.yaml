specVersion: v1
kind: BLUEPRINT
metadata:
  slug: n8n
  revision: 9
  description: >-
    n8n workflow automation behind the platform's sign-in, owned by its
    installer, with webhooks reachable and its own address wired in.
spec:
  components:
    web:
      componentRef: ./components/n8n.yaml
      compute:
        profile: general.economy.nano
      volumes:
        data:
          sizeGiB: 4
      # The platform signs viewers in before forwarding. Webhooks, forms, MCP
      # triggers and the public API are exempt, because the services that call
      # them never hold a viewer session (components/n8n.yaml).
      exposure:
        primary:
          visibility: PUBLIC
          access: AUTHENTICATED
          accessExemptions:
            - PATHS
      bindings:
        timezone:
          parameter: timezone
        ownerEmail:
          parameter: ownerEmail
        ownerPasswordHash:
          parameter: ownerPasswordHash
        # All three take this node's own allocated address, from the outputs the
        # component derives from its `primary` endpoint. A node reading its own
        # endpoint output is a discovery dependency and not a value cycle
        # (BP-CONN-002): an endpoint address is allocated before anything runs.
        #
        # N8N_HOST wants the bare host and the other two want the whole URL,
        # which is why the component publishes both properties rather than one.
        n8nHost:
          node: web
          output: publicHostname
        webhookURL:
          node: web
          output: publicURL
        editorBaseURL:
          node: web
          output: publicURL
  parameters:
    # The installer owns the deployment: their verified email, captured once
    # when the installation is created (BP-PARAM-011).
    ownerEmail:
      from: "${{ deployment.installer.email }}"
    # Disclosed to whoever manages the installation, and never bound: n8n
    # receives only the bcrypt hash below. 24 bytes in BASE64URL is 32
    # characters, inside the 72 bcrypt reads (BP-PARAM-012).
    ownerPassword:
      generator:
        byteLength: 24
        encoding: BASE64URL
      ui:
        label: Owner password
        order: 2
    ownerPasswordHash:
      hash:
        parameter: ownerPassword
        algorithm: BCRYPT
    timezone:
      default: UTC
      ui:
        label: Timezone
        order: 1
        examples:
          - UTC
          - Europe/London
          - America/New_York

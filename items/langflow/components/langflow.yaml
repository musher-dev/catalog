specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: langflowai/langflow:1.11.0
    endpoints:
      primary:
        containerPort: 7860
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        # /health_check answers only once the app (incl. DB) is genuinely up;
        # uvicorn serves /health before the app finishes booting, which would
        # declare readiness early. The platform probe is a one-shot startup
        # gate (not a continuous restart trigger), so the DB-coupled endpoint
        # is safe here (health_check_router.py).
        path: /health_check
        endpoint: primary
        initialDelaySeconds: 60
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
    envVars:
      - key: LANGFLOW_AUTO_LOGIN
        value:
          type: LITERAL
          value: 'false'
      - key: LANGFLOW_CONFIG_DIR
        value:
          type: LITERAL
          value: /app/langflow
      - key: LANGFLOW_SAVE_DB_IN_CONFIG_DIR
        # Without this the SQLite DB lands in the package install dir and is
        # LOST on container recreation — the volume only persisted config
        # files (docs.langflow.org/memory).
        value:
          type: LITERAL
          value: 'true'
    volumes:
      data:
        sizeGiB: 5
        mountPath: /app/langflow
  contract:
    inputs:
      superuser:
        schema:
          type: STRING
          default: admin
        required: true
        suppliedBy: USER
        ui:
          label: Admin username
        target:
          envVarKey: LANGFLOW_SUPERUSER
        description: Initial admin username for the Langflow UI
      superuserPassword:
        schema:
          type: STRING
          sensitive: true
        required: true
        suppliedBy: USER
        ui:
          label: Admin password
        target:
          envVarKey: LANGFLOW_SUPERUSER_PASSWORD
        generator:
          byteLength: 24
          encoding: ALPHANUMERIC
        description: Auto-generated admin password; rotate from the Configuration tab
      secretKey:
        schema:
          type: STRING
          sensitive: true
        required: true
        suppliedBy: USER
        ui:
          label: Secret key
        target:
          envVarKey: LANGFLOW_SECRET_KEY
        generator:
          byteLength: 32
          encoding: HEX
        description: Auto-generated key used to encrypt API keys and secrets stored
          in flows
    outputs: {}

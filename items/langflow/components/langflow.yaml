specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
  description: Langflow visual flow builder for LLM applications, with its database on one volume.
spec:
  type: SERVICE
  workload:
    source:
      image: langflowai/langflow:1.11.0
    endpoints:
      primary:
        targetPort: 7860
        protocol: HTTP
    health:
      readiness:
        # /health_check answers only once the app (incl. DB) is genuinely up;
        # uvicorn serves /health before the app finishes booting, which would
        # declare readiness early. The platform probe is a one-shot startup
        # gate (not a continuous restart trigger), so the DB-coupled endpoint
        # is safe here (health_check_router.py).
        http:
          endpoint: primary
          path: /health_check
        initialDelaySeconds: 60
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
    envVars:
      LANGFLOW_AUTO_LOGIN: 'false'
      LANGFLOW_CONFIG_DIR: /app/langflow
      # Without this the SQLite DB lands in the package install dir and is
      # LOST on container recreation — the volume only persisted config
      # files (docs.langflow.org/memory).
      LANGFLOW_SAVE_DB_IN_CONFIG_DIR: 'true'
    volumes:
      data:
        minSizeGiB: 5
        mountPath: /app/langflow
  contract:
    inputs:
      superuser:
        schema:
          type: string
        default: admin
        required: true
        target:
          envVarKey: LANGFLOW_SUPERUSER
        description: Initial admin username for the Langflow UI
      superuserPassword:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: LANGFLOW_SUPERUSER_PASSWORD
        description: Password for the initial admin account; rotate from the
          Configuration tab
      secretKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: LANGFLOW_SECRET_KEY
        description: Key used to encrypt API keys and secrets stored in flows
    outputs: {}

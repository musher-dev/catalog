specVersion: v2
kind: LISTING
metadata:
  slug: langflow
spec:
  itemType: BLUEPRINT
  displayName: Langflow
  summary: Visual canvas for prototyping LLM agents and RAG pipelines, exportable as APIs
  overview: |
    ## What it is
    Langflow is an open-source, drag-and-drop visual builder for chaining
    LLM calls, retrievers, agents, and tools. Drop nodes onto a canvas,
    wire them up, and ship a runnable agent or expose the flow as an API —
    no orchestration boilerplate.

    ## When to use
    - You're prototyping multi-step LLM workflows and want to iterate
      visually before exporting to code.
    - You want a low-friction RAG/agent canvas that non-engineering
      stakeholders can read and tweak.
    - You're comparing prompt, model, and retrieval variants side by side
      on the same flow.

    ## Defaults
    Single-container deployment of `langflowai/langflow:1.13.1` with the
    web UI on port 7860 behind the platform's HTTPS edge and the
    platform's sign-in. Signed-in people reach Langflow already signed in:
    it verifies the platform's signed assertion and creates each person an
    ordinary account, with their email and name, the first time they arrive.
    The flow-running API (`/api/v1/run`, webhooks and `/api/v1/responses`)
    stays reachable without signing in, for API clients, and Langflow still
    requires one of its API keys there. MCP clients must go through the
    sign-in.

    Those accounts are never Langflow admins. The admin account is still
    the admin username (default `admin`) with the auto-generated password
    from the deployment's Installation tab. Both are used once, to create
    the account: change the password inside Langflow afterwards, since
    editing either value later does not update it. Model providers are added as API keys inside Langflow; this
    deployment does not connect one for you. A
    separate auto-generated secret key encrypts provider API keys stored
    in your flows. SQLite-backed by default — fine for personal and
    small-team use; the Postgres path is documented upstream but not
    configured by this listing. A 5 GiB persistent volume mounted at
    `/app/langflow` holds the config, the database and local knowledge bases,
    so they survive container recreation. Marked beta because Langflow ships breaking
    changes more frequently than monthly.

    ## Upgrades
    Langflow 1.13 stores local Knowledge in SQLite instead of Chroma. Earlier
    versions of this listing kept local knowledge bases off the volume, so a
    base created before this version does not survive the upgrade and has to
    be rebuilt. Flows that use the Chroma DB or Local DB components have to
    move to a knowledge base or a remote vector store. Going back to 1.12
    needs a database backup taken before the upgrade, so at least export your
    projects first. The upgrade stops at startup if two usernames differ only
    by letter case: rename or delete one of them before upgrading.
  gettingStarted: |
    1. Open the deployment's URL and sign in to Musher. You arrive in Langflow
       already signed in, with an ordinary account of your own.
    2. Add your model provider's API key inside Langflow, then build your first
       flow on the canvas.
    3. To call a flow from outside, create a Langflow API key. The run API
       requires one.

    For admin tasks, use the **Admin username** and **Admin password** from the
    deployment's Installation tab, and change that password inside Langflow
    afterwards.

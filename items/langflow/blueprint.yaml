specVersion: v1
kind: BLUEPRINT
metadata:
  slug: langflow
  revision: 4
  description: Langflow with a generated admin password and flow-secret key, behind a public web UI.
spec:
  components:
    web:
      componentRef: ./components/langflow.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 5
      exposure:
        primary: PUBLIC
      bindings:
        superuser:
          parameter: superuser
        superuserPassword:
          parameter: superuserPassword
        secretKey:
          parameter: secretKey
  parameters:
    # A bound parameter never falls back to its input's default (BP-PARAM-003),
    # so the default the form offers is stated here as well as on the input.
    superuser:
      default: admin
      ui:
        label: Admin username
    superuserPassword:
      generator:
        byteLength: 24
        encoding: HEX
      ui:
        label: Admin password
    secretKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Secret key

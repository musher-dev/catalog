specVersion: v1
kind: BLUEPRINT
metadata:
  slug: langflow
  revision: 8
  description: Langflow behind the platform's sign-in, signing viewers in from its signed assertion, with a generated admin password and flow-secret key.
spec:
  components:
    web:
      componentRef: ./components/langflow.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 5
      # The platform signs viewers in and forwards each request with a signed
      # assertion, which Langflow verifies to sign the viewer in. Email and
      # name ride inside the assertion, so the accounts it provisions carry
      # them. The flow-running API is exempt (components/langflow.yaml).
      exposure:
        primary:
          visibility: PUBLIC
          access: AUTHENTICATED
          viewerIdentity: ASSERTION
          viewerClaims:
            - EMAIL
            - NAME
          accessExemptions:
            - PATHS
      bindings:
        # The platform's facts of this node's own `primary` allocation. A node
        # reading its own endpoint outputs is a discovery dependency and not a
        # value cycle (BP-CONN-002).
        assertionHeader:
          node: web
          output: assertionHeader
        assertionIssuer:
          node: web
          output: assertionIssuer
        assertionAudience:
          node: web
          output: assertionAudience
        assertionKeysURL:
          node: web
          output: assertionKeysURL
        superuser:
          parameter: superuser
        superuserPassword:
          parameter: superuserPassword
        secretKey:
          parameter: secretKey
  parameters:
    # A bound parameter never falls back to its input's default (BP-PARAM-003),
    # so the default the form offers is stated here as well as on the input.
    superuser:
      default: admin
      ui:
        label: Admin username
    superuserPassword:
      generator:
        byteLength: 24
        encoding: HEX
      ui:
        label: Admin password
    secretKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Secret key

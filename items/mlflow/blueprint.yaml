specVersion: v1
kind: BLUEPRINT
metadata:
  slug: mlflow
  revision: 8
  description: MLflow tracking server on local SQLite and volume-backed artifacts, both overridable at install.
spec:
  components:
    web:
      componentRef: ./components/mlflow.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 20
      exposure:
        primary: PUBLIC
      bindings:
        backendStoreURI:
          parameter: backendStoreURI
        artifactsDestination:
          parameter: artifactsDestination
        # This node's own allocated origin, from the output the component derives
        # from its `primary` endpoint, so the UI's writes pass MLflow's
        # cross-origin check. A node reading its own endpoint output is a
        # discovery dependency and not a value cycle (BP-CONN-002).
        corsAllowedOrigins:
          node: web
          output: publicURL
  parameters:
    # A bound parameter never falls back to its input's default (BP-PARAM-003),
    # so every default the form offers is stated here as well as on the input.
    #
    # Neither of these parameters may feed a sensitive input: a parameter
    # default is an authored literal wherever it is written, and a sensitive
    # contract takes none (COMP-VAL-005, §11). `backendStoreURI` is not
    # sensitive for exactly that reason, and its component says what that
    # costs.
    backendStoreURI:
      default: sqlite:////mlflow/mlflow.db
      ui:
        label: Backend store URI
        order: 1
        # The Postgres example spells the password `password` rather than
        # looking like a real one, and the description says the field is not
        # concealed, so nobody learns that from a log.
        examples:
          - sqlite:////mlflow/mlflow.db
          - postgresql://mlflow:password@postgres.internal:5432/mlflow
    artifactsDestination:
      default: /mlflow/mlruns
      ui:
        label: Artifact storage destination
        order: 2
        examples:
          - s3://my-bucket/mlflow
          - gs://my-bucket/mlflow

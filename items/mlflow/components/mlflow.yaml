specVersion: v1
kind: COMPONENT
metadata:
  revision: 9
  description: MLflow tracking server with its metadata store and proxied artifacts on one volume.
spec:
  type: SERVICE
  workload:
    source:
      # The -full build, not the bare one. The bare image is
      # `pip install mlflow==$VERSION` (docker/Dockerfile, v3.16.1), and core
      # mlflow carries no psycopg2, PyMySQL, boto3 or google-cloud-storage, so
      # the Postgres, S3 and GCS stores the install form offers would fail at
      # boot. docker/Dockerfile.full installs
      # mlflow[extras,azure,db,gateway,genai,auth] from the same base, for 369 MB
      # compressed against 291 MB (linux/amd64).
      image: ghcr.io/mlflow/mlflow:v3.16.1-full
    # The official image ships NO ENTRYPOINT/CMD (its Dockerfile is a bare
    # `pip install`); without an explicit server command the container
    # inherits python:slim's `python3`, reads EOF, and exits immediately. The
    # server reads MLFLOW_HOST / MLFLOW_PORT / MLFLOW_BACKEND_STORE_URI /
    # MLFLOW_ARTIFACTS_DESTINATION from the environment, so the bare command
    # suffices (https://mlflow.org/docs/latest/api_reference/cli.html).
    command:
      - mlflow
      - server
    endpoints:
      primary:
        targetPort: 5000
        protocol: HTTP
    health:
      readiness:
        # /health is MLflow's dedicated auth-bypassing 200 "OK"; the root
        # serves the heavy React bundle (mlflow/server/__init__.py).
        http:
          endpoint: primary
          path: /health
        # First boot creates the SQLite schema before the server listens; the
        # old 30s + 3-failure gate expired mid-init and the agent SIGTERM'd the
        # container (observed live). Same shape as the label-studio budget.
        initialDelaySeconds: 120
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    volumes:
      data:
        minSizeGiB: 20
        mountPath: /mlflow
  contract:
    inputs:
      # ADR 0033: every value that reaches this workload enters through an
      # input, including the constants below. They carry defaults, so no
      # blueprint has to wire them and the install form gains no field.
      host:
        schema:
          type: string
        default: 0.0.0.0
        target:
          envVarKey: MLFLOW_HOST
        description: Address the MLflow server binds inside the container.
      # A string, not an integer: the literal is what the image reads, and the
      # endpoint below names the port this has to agree with.
      port:
        schema:
          type: string
        default: '5000'
        target:
          envVarKey: MLFLOW_PORT
        description: Port the MLflow server listens on inside the container.
      # MLflow 3.x ships a Host-header validation middleware (DNS-rebinding
      # protection) whose default allowlist rejects gateway traffic on the
      # public hostname. The health probe is not affected: /health and /version
      # are exempt (HEALTH_ENDPOINTS, mlflow/server/security_utils.py, v3.16.1).
      # The container port binds loopback-only on the compute host and is
      # reachable solely through the platform edge, so Host validation adds
      # nothing here — disable it rather than chase every proxied hostname
      # (https://mlflow.org/docs/latest/self-hosting/security/).
      serverAllowedHosts:
        schema:
          type: string
        default: '*'
        target:
          envVarKey: MLFLOW_SERVER_ALLOWED_HOSTS
        description: Host headers the MLflow server accepts.
      # Sensitive, because a Postgres or MySQL URI carries its password inline.
      # NOT `sensitive`, and that is a decision rather than an oversight.
      #
      # What this field holds by default is `sqlite:////mlflow/mlflow.db` — a
      # path on the volume below, carrying no credential. Marking it sensitive
      # would forbid that default outright: a sensitive contract takes no
      # authored literal, from this document or from the blueprint's parameter
      # (COMP-VAL-005, §11), and the item would ask every installer to type a
      # URI before it could start. The value the item actually ships is not a
      # secret, so it is not marked as one.
      #
      # The cost is real and belongs in the open: a Postgres or MySQL URI
      # embeds a password, and a value supplied here is handled like any other
      # setting — it reaches resolution records, previews and logs in the
      # clear. The description below says so, the listing says so, and the
      # install form's examples say so, because the alternative is a user
      # discovering it afterwards. A deployment that cannot accept that should
      # give MLflow a database role whose credential is scoped to it.
      backendStoreURI:
        schema:
          type: string
        presentationHint: CONNECTION_STRING
        default: sqlite:////mlflow/mlflow.db
        required: true
        target:
          envVarKey: MLFLOW_BACKEND_STORE_URI
        description: >-
          SQLAlchemy URI for the tracking metadata store. Defaults to local
          SQLite on this deployment's volume. A Postgres or MySQL URI embeds a
          password, and this field is not treated as a secret — use a scoped
          database role.
      artifactsDestination:
        schema:
          type: string
        default: /mlflow/mlruns
        required: true
        # MLFLOW_ARTIFACTS_DESTINATION (not MLFLOW_DEFAULT_ARTIFACT_ROOT): the
        # server proxies artifact reads/writes to this destination, so remote
        # clients never interpret the path against their own filesystem
        # (https://mlflow.org/docs/latest/self-hosting/architecture/tracking-server/).
        target:
          envVarKey: MLFLOW_ARTIFACTS_DESTINATION
        description: Where the tracking server stores proxied run artifacts. Default
          uses the local volume; production should use s3:// or gs://.
      # This deployment's own origin, bound from the output below. Without it
      # the UI cannot write. MLflow rejects any POST, PUT, PATCH or DELETE to
      # /api/ or /ajax-api/ whose Origin is not localhost or on this list
      # (should_block_cors_request, security_utils.py, v3.16.1), and browsers
      # send Origin on same-origin POSTs. MLflow's UI searches and edits over
      # POST. Observed against 3.14.0 and 3.16.1 servers: a POST to
      # /ajax-api/2.0/mlflow/experiments/search with this origin was
      # "Cross-origin request blocked" until the origin was listed, and 200
      # after. The match is exact, and the platform's publicURL carries no
      # trailing slash (component spec §5.2), which is what it needs.
      corsAllowedOrigins:
        schema:
          type: string
        required: false
        target:
          envVarKey: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
        description: >-
          Comma-separated browser origins allowed to change state through the
          API. Must match the Origin header exactly — scheme included, no
          trailing slash.
    outputs:
      publicURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Public base URL this deployment answers at, as the platform allocated
          it. The blueprint binds it back into this node's own CORS allowlist.
        from:
          endpoint: primary
          property: publicURL

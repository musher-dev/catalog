specVersion: v2
kind: LISTING
metadata:
  slug: mlflow
spec:
  itemType: BLUEPRINT
  displayName: MLflow
  summary: Experiment tracking and model registry for ML teams — runs, metrics, artifacts
  overview: |
    ## What it is
    MLflow is the de-facto standard for tracking machine-learning
    experiments, packaging code, and managing a model registry. The
    tracking UI gives a single pane of glass over runs, parameters,
    metrics, and artifacts produced by your training pipelines.

    ## When to use
    - You're self-hosting an experiment-tracking server in front of your
      team's notebooks and CI runs.
    - You want a registry to promote models from training pipelines into
      production serving infrastructure.
    - You're comparing training runs across parameters and metrics and
      need the artifacts archived next to them.

    ## Defaults
    Single-container deployment of `ghcr.io/mlflow/mlflow:v3.18.0-full`
    running `mlflow server` with the tracking UI on port 5000 behind the
    platform's HTTPS edge. The backend store defaults to SQLite and
    artifacts are server-proxied onto the 20 GiB persistent volume at
    `/mlflow` — suitable for a small team. First boot creates the database
    schema before the server listens, so allow a couple of minutes before
    the app reports ready. Production teams point the two store URIs at
    Postgres or MySQL and at S3, GCS or Azure storage. The `-full` image
    carries those drivers, and both URIs are deploy parameters.

    ## Upgrades
    When this listing moves to a newer MLflow version, an existing deployment
    can migrate its database in place the first time it starts on the new
    version, and the app stays unavailable until that finishes. MLflow notes
    that these migrations can be slow and are not guaranteed to be
    transactional, and it asks for a restorable backup first. This deployment
    has no way to take or restore one of the default SQLite store, so if your
    run history matters, use Postgres or MySQL with its own backups.

    ## Access and security
    The tracking UI sits behind the platform's sign-in, so only people
    allowed into this deployment reach it. It also has MLflow's own login.
    The admin account is `admin`, with the generated password on the
    deployment's Installation tab, and an admin can add MLflow users from
    the UI. The browser asks for those credentials after you sign in.

    The tracking API (`/api`, artifact downloads, and OTLP traces at
    `/v1/traces`) stays reachable without the platform's sign-in, so the
    MLflow client works from notebooks and CI. It still needs MLflow
    credentials: set `MLFLOW_TRACKING_USERNAME` and
    `MLFLOW_TRACKING_PASSWORD` beside `MLFLOW_TRACKING_URI`. Earlier
    versions of this item had no login, so clients set up before this
    version must add credentials before they can reach the server again.

    **The backend store URI is not treated as a secret.** It defaults to a
    SQLite path, which is not one. If you point it at Postgres or MySQL, the
    URI you enter embeds a password, and it is handled like any other
    deployment setting — it appears in the deployment's configuration, and in
    the records and logs of the deployment. Give MLflow a database role
    scoped to it, and rotate that role's password rather than a shared one.
  gettingStarted: |
    1. Allow a couple of minutes on first boot while the database schema is
       created.
    2. Open the deployment's URL and sign in to Musher. When your browser then
       asks for credentials, use `admin` and the **Admin password** from the
       deployment's Installation tab.
    3. Point your notebooks and CI at the server by setting
       `MLFLOW_TRACKING_URI`, `MLFLOW_TRACKING_USERNAME` and
       `MLFLOW_TRACKING_PASSWORD`, then log a first run.
    4. Add MLflow users for your team from the UI.
  category: MODELS
  lifecycleStage: STABLE
  tags:

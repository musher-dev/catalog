specVersion: v1
kind: BLUEPRINT
metadata:
  slug: flowise
  revision: 4
  description: Flowise with a generated credential-encryption key and a public web UI.
spec:
  components:
    web:
      componentRef: ./components/flowise.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 5
      exposure:
        primary: PUBLIC
      bindings:
        flowiseSecretKey:
          parameter: flowiseSecretKey
  parameters:
    flowiseSecretKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Secret key
        order: 1

specVersion: v1
kind: BLUEPRINT
metadata:
  slug: flowise
  revision: 7
  description: >-
    Flowise behind the platform's sign-in, with its chat and flow APIs reachable
    and a generated credential-encryption key.
spec:
  components:
    web:
      componentRef: ./components/flowise.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 5
      # The platform signs viewers in before forwarding, which also limits the
      # first-run admin sign-up to people allowed into the installation. The
      # prediction, embed and webhook routes are exempt (components/flowise.yaml).
      exposure:
        primary:
          visibility: PUBLIC
          access: AUTHENTICATED
          accessExemptions:
            - PATHS
      bindings:
        flowiseSecretKey:
          parameter: flowiseSecretKey
  parameters:
    flowiseSecretKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Secret key
        order: 1

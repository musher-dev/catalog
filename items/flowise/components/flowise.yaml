specVersion: v1
kind: COMPONENT
metadata:
  revision: 5
  description: Flowise low-code LLM flow builder, storing flows and credentials on one volume.
spec:
  type: SERVICE
  workload:
    source:
      image: flowiseai/flowise:3.1.3
    endpoints:
      primary:
        targetPort: 3000
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /api/v1/ping
        # First boot runs the TypeORM migrations against SQLite and loads every
        # node package before the server listens. The old gate, 30s and three
        # failures at the default 10s period, gave that one minute in all. The
        # wait now runs to about two and a half minutes, the same shape as
        # n8n's. Retries are cheap, and a reaped first boot starts over.
        initialDelaySeconds: 45
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    volumes:
      data:
        minSizeGiB: 5
        mountPath: /root/.flowise
  contract:
    inputs:
      # ADR 0033: every value that reaches this workload enters through an
      # input, including the constants below. They carry defaults, so no
      # blueprint has to wire them and the install form gains no field.
      #
      # All four sit under the volume mounted below, which is what makes the
      # database, the encryption key, uploaded blobs and the logs survive a
      # container recreation.
      databasePath:
        schema:
          type: string
        default: /root/.flowise
        target:
          envVarKey: DATABASE_PATH
        description: Directory Flowise keeps its SQLite database in.
      secretKeyPath:
        schema:
          type: string
        default: /root/.flowise
        target:
          envVarKey: SECRETKEY_PATH
        description: Directory Flowise keeps its credential encryption key in.
      blobStoragePath:
        schema:
          type: string
        default: /root/.flowise/storage
        target:
          envVarKey: BLOB_STORAGE_PATH
        description: Directory Flowise stores uploaded files in.
      logPath:
        schema:
          type: string
        default: /root/.flowise/logs
        target:
          envVarKey: LOG_PATH
        description: Directory Flowise writes its logs to.
      flowiseSecretKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: FLOWISE_SECRETKEY_OVERWRITE
        description: Key used to encrypt credentials stored in flows; keeps them
          decryptable across restarts
    outputs: {}

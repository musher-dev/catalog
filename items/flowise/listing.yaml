specVersion: v1
kind: LISTING
metadata:
  slug: flowise
spec:
  itemType: BLUEPRINT
  displayName: Flowise
  summary: Drag-and-drop builder that turns LLM chains and agents into APIs and chat widgets
  description: |
    ## What it is
    Flowise is an open-source visual builder for LLM applications. Drag
    nodes (models, vector stores, retrievers, tools, agents) onto a
    canvas, wire them together, and expose the result as a REST API or an
    embeddable chat widget. It is an independent project in the same
    "agents on a canvas" niche as Langflow.

    ## When to use
    - You want to ship an LLM agent or RAG endpoint without writing
      orchestration code.
    - You need an embeddable chat widget or REST API your application can
      call into.
    - You're iterating on prompt/retrieval chains with non-engineers who
      work better on a canvas than in code.

    ## Defaults
    Single-container deployment of `flowiseai/flowise:3.1.4` with the web
    UI on port 3000 behind the platform's HTTPS edge and the platform's
    sign-in: only people allowed into this installation reach the builder.
    You create the Flowise admin account from the sign-up screen on first
    launch; until one exists, the first signed-in person to reach that
    screen becomes the admin. The prediction API, embedded chat widgets,
    webhooks, MCP and vector upserts stay reachable without signing in, and
    Flowise still checks a chatflow's API key where you assign one. Share
    links (`/chatbot/…`) open only for signed-in people. Model providers are added as credentials inside
    Flowise, per flow; this deployment does not connect one for you.
    SQLite-backed by
    default (pointing it at Postgres is documented upstream but not
    configured by this listing). A persistent encryption key is
    auto-generated at deploy so credentials stored in your flows stay
    decryptable across restarts, and a 5 GiB persistent volume mounted at
    `/root/.flowise` holds the database, flow storage, and logs.

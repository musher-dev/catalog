# copy-of: items/llm-endpoint/components/endpoint.yaml@6
# copy-differs: /metadata/description, /spec/contract/inputs/llm/description
# copy-differs: /spec/contract/outputs/apiKey/description, /spec/contract/outputs/baseURL/description
#
# The language model LibreChat talks to, as a node this platform does not run
# (component spec §5.6).
#
# The connection enters here and nowhere else (COMP-CONNECTION-002). The `web`
# node declares three ordinary string inputs and the blueprint wires them to the
# three outputs below, so the endpoint, the credential and the model always come
# from one acquired connection rather than three independently supplied values.
#
# Nothing resolves the address, connects to it, or checks that anything answers
# there (component spec §11).
specVersion: v2
kind: COMPONENT
metadata:
  revision: 2
  description: The language-model API LibreChat sends chat requests to, taken whole as one connection.
spec:
  type: EXTERNAL
  contract:
    inputs:
      llm:
        description: >-
          Language-model connection this deployment's chat interface runs on:
          endpoint, credential and model, acquired together.
        connection:
          # OPENAI_CHAT_COMPLETIONS rather than ANTHROPIC_MESSAGES. LibreChat
          # speaks both from environment variables alone, but its OpenAI
          # endpoint (OPENAI_REVERSE_PROXY, api/server/services/Config/
          # EndpointService.js, v0.8.8) is the one that takes any compatible
          # server, so it accepts the widest range of replacement connections.
          #
          # Streaming and tool calls, both load-bearing. Every chat, including
          # one with no agent, runs through LibreChat's agents pipeline
          # (POST /api/agents/chat/:endpoint, api/server/routes/agents/chat.js)
          # and streams its reply. Agents built in the UI attach their tools
          # (web search, MCP servers, actions) as OpenAI `tools`, so an
          # endpoint without tool calls would be accepted here and then fail
          # on the first agent that uses one.
          #
          # This is declared on the supplying node rather than on `web`: after
          # ADR 0033 a workload sees three strings and cannot demand a protocol.
          protocol: OPENAI_CHAT_COMPLETIONS
          capabilities:
            - STREAMING
            - TOOL_CALLS
    outputs:
      baseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Base URL of the OpenAI-compatible API, from the connection this node
          was given.
        from:
          input: llm
          member: baseURL
      apiKey:
        schema:
          type: string
        sensitive: true
        description: Bearer credential for the API above, from the same connection.
        from:
          input: llm
          member: apiKey
      model:
        schema:
          type: string
        description: Model the API answers with by default, from the same connection.
        from:
          input: llm
          member: model

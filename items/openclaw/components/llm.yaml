# copy-of: items/llm-endpoint/components/endpoint.yaml@6
# copy-differs: /metadata/description, /spec/contract/inputs/llm/description
# copy-differs: /spec/contract/outputs/apiKey/description, /spec/contract/outputs/baseURL/description
# copy-differs: /spec/contract/outputs/model/description
#
# The language model the OpenClaw agent runs on, as a node this platform does
# not run (component spec §5.6).
#
# The connection enters here and nowhere else (COMP-CONNECTION-002). The `web`
# node declares three ordinary string inputs and the blueprint wires them to the
# three outputs below, so the endpoint, the credential and the model always come
# from one acquired connection rather than three independently supplied values.
#
# Nothing resolves the address, connects to it, or checks that anything answers
# there (component spec §11).
specVersion: v2
kind: COMPONENT
metadata:
  revision: 5
  description: The language-model API the OpenClaw agent sends model requests to, taken whole as one connection.
spec:
  type: EXTERNAL
  contract:
    inputs:
      llm:
        description: >-
          Language-model connection the agent runs on: endpoint, credential and
          model, acquired together.
        connection:
          # Streaming and tool calls, both unconditionally. Observed at 2026.11.1,
          # with the boot command in openclaw.yaml applied and a mock server
          # logging what it received. One "say ping" turn through the gateway sent
          # POST {baseURL}/chat/completions with `stream: true`, 14 tool
          # definitions, the model id as given (a `/` in it is fine), the key from
          # LLM_API_KEY as a Bearer token, only system and user roles, and no
          # reasoning field. It also sent stream_options, tool_choice and
          # max_completion_tokens.
          #
          # Embeddings are not required. Doctor warns on every boot that it found
          # no embedding key, and a memory search still answers: with the provider
          # unset, upstream falls back to keyword-only ranking when embedding
          # setup fails (docs/concepts/memory-search.md).
          #
          # OPENAI_CHAT_COMPLETIONS rather than ANTHROPIC_MESSAGES, though OpenClaw
          # speaks both. It accepts the widest range of compatible defaults and
          # replacement connections, and it keeps OpenClaw off its Claude-specific
          # beta and thinking paths on a host that is not api.anthropic.com.
          #
          # This is declared on the supplying node rather than on `web`: after
          # ADR 0033 a workload sees three strings and cannot demand a protocol.
          protocol: OPENAI_CHAT_COMPLETIONS
          capabilities:
            - STREAMING
            - TOOL_CALLS
    outputs:
      baseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Base URL of the OpenAI-compatible chat-completions API, from the
          connection this node was given.
        from:
          input: llm
          member: baseURL
      apiKey:
        schema:
          type: string
        sensitive: true
        description: Bearer credential for the API above, from the same connection.
        from:
          input: llm
          member: apiKey
      model:
        schema:
          type: string
        description: Model the agent uses by default, from the same connection.
        from:
          input: llm
          member: model

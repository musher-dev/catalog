specVersion: v1
kind: COMPONENT
metadata:
  version: 2
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      # PINNED, and the pin is load-bearing rather than merely current: 2026.7.1
      # is the last stable release in which
      # `gateway.controlUi.dangerouslyDisableDeviceAuth` still works, and this
      # item depends on it to be reachable at all (see the block above `command`).
      #
      # Verified by reading `shouldSkipControlUiPairing` in each published
      # bundle: 2026.7.1 ends `return role === "operator" && policy.allowBypass`,
      # while 2026.8.1 and 2026.8.2 both end `return null`, having dropped that
      # branch. Upstream calls the key "a retired break-glass input, now fully
      # inert" and has `doctor --fix` delete it. 2026.7.2 exists only as betas,
      # which this catalog does not pin.
      #
      # So bumping this tag re-breaks the deployment silently. Anything past
      # 2026.7.1 has to pair devices, which means either re-adding the
      # in-container `devices approve` watcher this item used to carry, or
      # `gateway.auth.trustedProxy.deviceAutoApprove` (2026.8.x only), which
      # needs `gateway.auth.mode: "trusted-proxy"` and therefore a platform edge
      # that injects an identity header. Settle that before changing the tag.
      ref: ghcr.io/openclaw/openclaw:2026.7.1
    # Converge config through OpenClaw's own `config set` CLI, then exec the
    # stock gateway entrypoint (`tini -s --` passes argv through, so `sh -c` works).
    #
    # The Control UI origin allowlist (`gateway.controlUi.allowedOrigins`) is
    # CONFIG-FILE-ONLY — verified against 2026.7.1, whose bundle declares no
    # matching env var — and without this deployment's public origin in it the
    # gateway rejects the browser with "Browser origin not allowed".
    #
    # `config set` (not a hand-written openclaw.json) is what upstream's own
    # container guide uses, and it is the only form that works: the CLI writes a
    # normalized document carrying the `meta.lastTouchedVersion` stamp the gateway
    # expects, whereas a hand-rolled file is rejected as clobbered config
    # ("existing config is missing gateway.mode"). Verified live: after
    # `config set`, the origin survives gateway startup and /readyz returns 200.
    #
    # Run unconditionally on every boot rather than behind a first-boot guard —
    # the config lives on a persistent volume, so a guard would pin the very first
    # boot's origin forever and leave a re-deployed app permanently unreachable.
    # `config set` is declarative, so re-applying is a no-op.
    #
    # GATEWAY AUTH IS UNTOUCHED, despite the name of the key below.
    # `gateway.auth.mode` stays at its default (`token`), so every Control UI
    # connection still has to present OPENCLAW_GATEWAY_TOKEN. Verified by
    # reading the connect path in the 2026.7.1 bundle
    # (dist/message-handler-*.js), where three gates run in this order:
    #
    #   1. handleMissingDeviceIdentity()  — device identity; allowBypass admits
    #   2. `if (!authOk) { rejectUnauthorized(authResult); return; }`
    #   3. shouldSkipControlUiPairing()   — pairing; allowBypass skips
    #
    # Gate 2 is unconditional — no isControlUi test, no allowBypass exemption —
    # and it sits BETWEEN the two gates the key affects. So the key removes
    # device identity and pairing while the token check stays fully enforced.
    #
    # That is the intended posture for this item: anyone holding the token gets
    # in from any browser, and no device is enrolled or allowlisted. Device
    # pairing is a second gate that a valid token does not satisfy, it can only
    # be cleared by an already-paired admin session, and on a fresh deployment
    # nothing is ever paired — so left alone the Control UI is permanently
    # unreachable, reporting "device pairing required (requestId: ...)" and
    # naming a CLI that a catalog user has no host shell to run. Upstream was
    # asked to let a valid token bypass pairing and declined (openclaw#29908,
    # closed as not planned).
    #
    # The alternative, carried here previously, was an in-container watcher that
    # approved pending requests via `devices approve`. It worked and kept device
    # identity, but it made a background process load-bearing for reachability
    # and put a cold CLI start in front of every first connect. Traded away
    # deliberately for a declarative key and an instant first load.
    #
    # What it costs: with no device identity there is no second factor and no
    # per-device revocation, so a leaked token is sufficient on its own, and
    # browsers re-present the token each session instead of holding a stored
    # device token. `openclaw security audit` reports
    # `gateway.control_ui.device_auth_disabled` as critical — expected here, not
    # a regression. The token is the whole boundary; rotate it if it leaks.
    command: >-
      sh -c 'set -e;
      node /app/dist/index.js config set --batch-json
      "[{\"path\":\"gateway.mode\",\"value\":\"local\"},
      {\"path\":\"gateway.bind\",\"value\":\"lan\"},
      {\"path\":\"gateway.controlUi.allowedOrigins\",\"value\":[\"${OPENCLAW_PUBLIC_ORIGIN%/}\"]},
      {\"path\":\"gateway.controlUi.dangerouslyDisableDeviceAuth\",\"value\":true}]";
      exec node openclaw.mjs gateway'
    endpoints:
      primary:
        containerPort: 18789
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        # /readyz is the machine-readable gate; /healthz can return the Control UI
        # HTML shell with a 200, which would falsely read as ready.
        path: /readyz
        endpoint: primary
        # Node boot + SQLite migrations run before the gate opens on first start.
        initialDelaySeconds: 45
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
      liveness:
        path: /healthz
        endpoint: primary
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
    envVars:
      # OPENCLAW_GATEWAY_BIND is deliberately left at its default (routable) bind:
      # the "loopback" guidance assumes a reverse proxy sharing the container's
      # network namespace, but here the platform edge is a separate hop, so a
      # loopback bind would make containerPort 18789 unreachable.
      #
      # No mDNS advertising inside a container network (also auto-disabled when
      # the runtime detects a container; kept explicit for intent).
      - key: OPENCLAW_DISABLE_BONJOUR
        value:
          type: LITERAL
          value: "1"
    volumes:
      # Core state: openclaw.json, SQLite session DBs, installed plugins, .env, and
      # the agent workspace (default /home/node/.openclaw/workspace lives inside
      # this directory, so a single claim covers config + workspace).
      config:
        sizeGib: 10
        mountPath: /home/node/.openclaw
      # Master encryption key for OAuth-backed auth profiles. Kept as its own claim
      # because OpenClaw intentionally places this key outside the config directory,
      # so connected-channel tokens survive restarts and stay decryptable.
      auth-secrets:
        sizeGib: 1
        mountPath: /home/node/.config/openclaw
  contract:
    inputs:
      # Master gateway token: auto-minted at deploy, shown on the Configuration tab, and
      # pasted into the Control UI on first visit. 32 bytes of hex == a 64-char token,
      # matching the project's `openssl rand -hex 32` guidance.
      gatewayToken:
        schema:
          type: STRING
          isSensitive: true
        isRequired: true
        suppliedBy: USER
        ui:
          label: Gateway token
          order: 1
        target:
          envVarKey: OPENCLAW_GATEWAY_TOKEN
        generator:
          byteLength: 32
          encoding: HEX
        description: >-
          Master token authenticating the Control UI, WebSocket streams, and HTTP API.
      publicOrigin:
        schema:
          type: STRING
          format: ENDPOINT_URL
        isRequired: false
        suppliedBy: USER
        ui:
          label: Public origin
          order: 3
          prominence: SECONDARY
          examples:
            - https://openclaw.example.com
        target:
          envVarKey: OPENCLAW_PUBLIC_ORIGIN
        platformDefault:
          type: SELF_ADDRESS
          source: PUBLIC_URL
        description: >-
          Public https origin of this deployment's Control UI, written into
          gateway.controlUi.allowedOrigins at first boot so browser sessions from
          the public hostname are accepted. Leave blank to use this deployment's
          own generated URL; override only for a custom domain.
      timezone:
        schema:
          type: STRING
          format: TIMEZONE
          default: UTC
        isRequired: false
        suppliedBy: USER
        ui:
          label: Timezone
          order: 2
        # The container consumes the standard TZ variable (upstream compose maps
        # its host-side OPENCLAW_TZ input onto TZ; OPENCLAW_TZ itself is not read
        # by the gateway runtime).
        target:
          envVarKey: TZ
        description: IANA timezone for the agent's scheduled tasks and temporal reasoning.
    outputs: {}

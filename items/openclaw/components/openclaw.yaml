specVersion: v2
kind: COMPONENT
metadata:
  revision: 15
  description: >-
    OpenClaw agent gateway and Control UI behind the platform edge's sign-in,
    with its config, sessions and credentials on two volumes.
spec:
  type: SERVICE
  workload:
    source:
      # PINNED. 2026.11.2 is the latest stable release (2026-11-08). The tag on
      # ghcr carries no `v` prefix.
      #
      # Known upstream issue at this tag: the Control UI does not load in iOS 18
      # Safari, as of 2026.10.10 (openclaw/openclaw#193540).
      #
      # When bumping, re-read:
      #
      #   - docker-entrypoint.mjs, for which commands it passes through, and
      #     src/commands/doctor-original-capture.ts, for the activation marker
      #     the boot command sets. The marker is upstream's internal name, not a
      #     documented setting. If it is renamed, nothing fails: every boot just
      #     goes back to taking a full copy of the state.
      #   - src/gateway/server-http-request.ts and server-http-probes.ts, for
      #     which peers reach the probe routes. The Control UI answers unknown
      #     paths with a catch-all 200, so a probe route that disappeared would
      #     still read as healthy.
      #   - src/gateway/server/ws-connection/connect-pairing-approval-plan.ts,
      #     for the trusted-proxy auto-approve lane.
      image: ghcr.io/openclaw/openclaw:2026.11.2
    # BOOT ORDER: Doctor, then `config set`, then the gateway.
    #
    # `command` replaces the image's CMD and keeps its ENTRYPOINT, `tini -s --
    # node /app/docker-entrypoint.mjs`. That adapter runs Doctor itself only when
    # its argv is a foreground gateway run (`node openclaw.mjs gateway` and the
    # like), and it treats a failed Doctor as fatal. Any other command, `sh -c`
    # here, it hands straight to process.execve unchanged, so tini still
    # supervises it. The adapter cannot run anything between its Doctor and the
    # gateway, and `config set` has to run there, so this script runs Doctor
    # itself. Its final `exec node openclaw.mjs gateway` does not go back through
    # the adapter, so Doctor runs once per boot.
    #
    # DOCTOR. `config set` refuses to write over an invalid existing config and
    # points at `doctor --fix`, and some conversions (older conversations,
    # pairing records, file-based queues) wait for an explicit Doctor run rather
    # than happening on restart. A volume carried over from an earlier release
    # needs both, and this is also what removes retired keys it may carry, such
    # as gateway.controlUi.dangerouslyDisableDeviceAuth. `--non-interactive`
    # applies the startup-blocking migrations without prompting and exits 1 when
    # a repair is incomplete. That exit is reported and not fatal, so it cannot
    # become a crash loop. If state really cannot be migrated, the gateway exits
    # 78 on its own (docs/install/docker.md).
    #
    # Doctor's report on a healthy boot still carries warnings that are expected
    # here: mcp.apps.sandboxOrigin is unset (see the block above `endpoints`), no
    # command owner is configured (that is for chat channels; browsers are
    # admitted by trusted-proxy auth), no embedding key is found
    # (components/llm.yaml), and the gateway is bound to `lan`.
    #
    # THE ACTIVATION MARKER. Before repairing, `doctor --fix` copies the local
    # state to /home/node/.openclaw.update-captures/ and keeps the copy for 30
    # days (src/commands/doctor-original-capture.ts). Without the marker it does
    # that on every run, even with nothing to repair. The adapter has set
    # OPENCLAW_IMAGE_ACTIVATION_CAPTURE_MARKER on its own Doctor since 2026.10.6,
    # but `sh -c` skips the adapter, so this script sets it the same way, on that
    # one command. The marker records the copy this container already made, so
    # a restart still runs the repair pass and skips the full copy. /tmp survives
    # a restart and not a replacement, so a new image takes a new copy.
    #
    # That copy is on no volume. It sits in the container's writable layer, goes
    # away with the container, and holds whatever the state holds, including
    # connected-channel OAuth tokens in plaintext. It is capped at 10 minutes, and
    # if it fails or times out Doctor logs that and carries on with the repair.
    # It is not a backup: the volumes are what to back up.
    #
    # CONFIG. `config set` (not a hand-written openclaw.json) is what upstream's
    # own container guide uses (docs/install/docker.md), and it is the only form
    # that works: the CLI writes a normalized document carrying the
    # `meta.lastTouchedVersion` stamp the gateway expects, whereas a hand-rolled
    # file is rejected as clobbered config ("existing config is missing
    # gateway.mode").
    #
    # Run unconditionally on every boot rather than behind a first-boot guard:
    # the config lives on a persistent volume, so a guard would pin the very first
    # boot's origin forever and leave a re-deployed app permanently unreachable.
    # `config set` is declarative, so re-applying is a no-op.
    #
    # `gateway.bind=lan` is set explicitly. In a container the default is
    # `auto` (src/gateway/net.ts `defaultGatewayBindMode`), and the platform
    # edge is a separate network hop, so the listener must be on a routable
    # interface. OPENCLAW_GATEWAY_BIND is not set: it is a compose-file
    # variable that the gateway runtime does not read.
    #
    # PUBLIC ORIGIN. Two settings carry one value, and they are config-file-only.
    # `gateway.publicOrigin` is the origin upstream builds per-requester MCP OAuth
    # callbacks, chat deep links and plugin viewer links from
    # (docs/gateway/config-gateway.md). `gateway.controlUi.allowedOrigins` is the
    # browser-origin allowlist. An omitted allowlist defaults to
    # `[gateway.publicOrigin]`, but an authored list, even an empty one, overrides
    # it (src/config/gateway-control-ui-origins.ts). The explicit list stays because
    # volumes from earlier releases already carry it and `config set` would not
    # remove it. A non-loopback bind with the Control UI on refuses to start with
    # neither (src/gateway/server-runtime-config.ts).
    #
    # ACCESS: TRUSTED-PROXY. There is no token screen. The blueprint exposes
    # `primary` with `access: RESTRICTED` and `viewerIdentity: HEADER`
    # (blueprint §4.5, ADR 0034). So the platform forwards only viewers who sign
    # in and whom the deployment's access policy admits (BP-ACCESS-002). It strips
    # inbound copies of the identity header and of Forwarded / X-Forwarded-* /
    # X-Real-IP, then sets the identity header to a stable, opaque user id on HTTP
    # requests and WebSocket upgrades (BP-ACCESS-003). The header name and the
    # proxy addresses are platform facts of the endpoint allocation, read through
    # the `viewerIdentityHeader` and `trustedProxyCIDRs` outputs below and bound
    # back into this node's inputs. Nothing here defaults or guesses them.
    #
    # The gateway (docs/gateway/trusted-proxy-auth.md) accepts that header only
    # when:
    #
    #   1. the TCP peer is inside `gateway.trustedProxies` and X-Forwarded-For
    #      names a non-loopback client, else `proxy_attribution_required`. These
    #      are the addresses this container sees as its peer: the compute host's
    #      proxy, not the edge and not loopback. No other workload or tenant may
    #      originate from them (BP-ACCESS-004);
    #   2. the peer is neither loopback nor one of this container's own
    #      interface addresses;
    #   3. the header is present and non-blank.
    #
    # `deviceAutoApprove` then pairs the browser silently, so a first visit
    # lands connected, and every browser is a revocable paired device.
    #
    # `operator.admin` is listed in the auto-approve scopes deliberately: every
    # viewer the platform admits is treated as an owner of this deployment, the
    # "mutually trusting team" of upstream's trust model
    # (docs/gateway/security/trust-model.md). `operator.pairing`, which the Control
    # UI also asks for, is not listed because admin satisfies every `operator.*`
    # scope (docs/gateway/operator-scopes.md). `openclaw security audit` reports
    # this as the CRITICAL `gateway.trusted_proxy_device_auto_approve_admin`
    # finding, and the gateway logs a warning at startup. That is expected here,
    # not a regression.
    #
    # `allowUsers` and `gateway.auth.identityScopes` stay unset for the same
    # reason: who may enter is the deployment's access policy, and no one is
    # singled out. The narrower posture upstream recommends is available if that
    # changes: take `operator.admin` off this list and grant it per connection
    # through `identityScopes`, keyed on a parameter `from: ${{
    # deployment.creator.identity }}` (BP-PARAM-011), the same string this header
    # carries for that person (BP-ACCESS-006). The cost is that admin stays with
    # the creator alone, and a deployment an API key creates has no creator
    # identity, so it would be refused. Once the platform can send a role,
    # `x-openclaw-scopes` can narrow it per user instead.
    #
    # The whole boundary is the platform's sign-in plus the trusted proxy
    # addresses. A paired device outlives a sign-out: revoke it in the Control
    # UI. An open WebSocket outlives one only for the bounded window the
    # platform documents (BP-ACCESS-005).
    #
    # THE LANGUAGE MODEL. It arrives as the `llm` connection declared at the
    # foot of this file, in three env vars this item names (LLM_BASE_URL,
    # LLM_API_KEY, LLM_MODEL). Upstream reads no env var for a provider's base
    # URL or a default model, so there is no upstream name to target. The boot
    # command writes the three into OpenClaw's documented custom-provider shape
    # instead (docs/concepts/model-providers/custom-providers.md, "Local proxies"):
    #
    #   - models.providers.llm, with `api: openai-completions`. The OpenAI SDK
    #     appends /chat/completions to baseUrl, so a base ending /v1 is what it
    #     wants. On a host other than api.openai.com, OpenClaw also drops the
    #     developer role and OpenAI-only request shaping.
    #   - `apiKey` is a SecretRef naming the env var, `{source: env, provider:
    #     default, id: LLM_API_KEY}`, so the credential stays in the process env
    #     (docs/gateway/secrets/secretref-contract.md). It is deliberately not the
    #     `${LLM_API_KEY}` string form. Doctor treats that string as a plaintext
    #     credential: any boot that finds it copies the resolved key into
    #     state/openclaw.sqlite on the volume, and rotating the connection leaves
    #     the old key there (src/commands/doctor-model-catalog-credentials.ts).
    #     Observed at 2026.11.1 with the SecretRef: the key is in no file across
    #     restarts and rotation, and `openclaw secrets audit --check` is clean. A
    #     volume carried over from the string form keeps the copy it already has,
    #     and takes one on its first boot here because Doctor runs before `config
    #     set`. Requests still use the current key.
    #   - One model entry for each model `GET <base>/models` lists with the
    #     connection's key, because OpenClaw reads a custom provider's models
    #     only from its configuration. Each is `reasoning: false` and `input:
    #     [text]`, stated even though they are the custom-provider defaults, so
    #     OpenClaw does not ask for thinking or vision. The connection's own model
    #     is always among them. If the list cannot be read within five seconds,
    #     the entries are the connection's model and the one already chosen, and
    #     the boot carries on, so a model endpoint having a bad moment neither
    #     stops the agent starting nor loses the choice.
    #   - agents.defaults.model, as the whole object rather than `.primary`, so
    #     it succeeds under `set -e` whatever shape a UI edit left behind. The
    #     primary is a model the user chose, while the list still has it, and
    #     otherwise the connection's. A primary is the user's choice only when
    #     it differs from the connection model this boot last wrote, which it
    #     records in `musher-connection-model` in the state directory once
    #     `config set` succeeds. Without that, the boot's own write would read
    #     as a choice, and a deployment whose connection moved to another model
    #     would keep the old one as its default. With no record yet, on a first
    #     boot or the first under this revision, the primary follows the
    #     connection: before this revision a pick did not survive a restart, so
    #     any primary a volume holds then was written by a boot. `config set`
    #     resolves model refs before writing. `llm/<model>` resolves because the
    #     provider is written in the same batch, but a model id OpenClaw cannot
    #     parse fails the boot here, visibly.
    #
    # Node builds those two entries because a model id can hold a slash or a
    # quote, and the shell should not be assembling JSON around one.
    #
    # Because the batch runs on every boot, the connection is authoritative for
    # the provider. A rotated credential or replaced connection takes effect at
    # the next restart, and models added to the gateway appear then too, as
    # does a new connection model when no one has picked another default. A
    # fallback chosen in the Control UI does not survive one, and the listing
    # says so. Another provider added under Settings does, because the batch
    # writes only `models.providers.llm`.
    #
    # EXEC FORM: argv, no shell of the platform's own. The shell this needs is
    # the one named here. The script uses `${VAR%/}` to strip a trailing slash
    # off the origin. OPENCLAW_TRUSTED_PROXIES is an array input, so it
    # arrives as a compact JSON array and is spliced into the batch as it is.
    # If it is empty or missing, the batch is not valid JSON and `config set`
    # fails the boot under `set -e`, which fails closed.
    #
    # WORKAROUND(platform-api#1447): the gateway reads its settings from a
    #   config file, which the start writes with `config set`.
    command:
      - sh
      - -c
      - >-
        set -e;
        OPENCLAW_IMAGE_ACTIVATION_CAPTURE_MARKER=/tmp/openclaw-image-activation-capture
        node /app/dist/index.js doctor --fix --non-interactive
        || echo "openclaw: doctor --fix reported an incomplete repair; continuing" >&2;
        LLM_PICK="$(node /app/dist/index.js config get agents.defaults.model.primary 2>/dev/null || true)";
        LLM_CONFIG="$(LLM_PICK="$LLM_PICK" node -e '
        const env = process.env;
        const base = env.LLM_BASE_URL.replace(/\/+$/, "");
        const entry = (m) => ({
          id: m.id, name: m.id, reasoning: false, input: ["text"],
          ...(m.context_length > 0 ? { contextWindow: m.context_length } : {}),
          ...(m.max_tokens > 0 ? { maxTokens: m.max_tokens } : {}),
        });
        fetch(base + "/models", {
          headers: { Authorization: "Bearer " + env.LLM_API_KEY },
          signal: AbortSignal.timeout(5000),
        })
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then((body) => body.data.filter((m) => m && typeof m.id === "string" && m.id))
          .catch((e) => { console.error("openclaw: could not list the gateway models: " + e.message); return []; })
          .then((listed) => {
            const record = env.OPENCLAW_STATE_DIR + "/musher-connection-model";
            let wrote = null;
            try { wrote = require("fs").readFileSync(record, "utf8"); } catch {}
            const pick = (env.LLM_PICK || "").trim();
            const chosen = wrote !== null && pick.startsWith("llm/") && pick !== "llm/" + wrote ? pick : "";
            const held = listed.length === 0 && chosen ? [{ id: chosen.slice(4) }] : listed;
            const models = held.some((m) => m.id === env.LLM_MODEL) ? held : [{ id: env.LLM_MODEL }, ...held];
            const kept = chosen !== "" && models.some((m) => "llm/" + m.id === chosen);
            console.log(JSON.stringify([
              { path: "models.providers.llm", value: {
                baseUrl: base, api: "openai-completions",
                apiKey: { source: "env", provider: "default", id: "LLM_API_KEY" },
                models: models.map(entry) } },
              { path: "agents.defaults.model", value: { primary: kept ? chosen : "llm/" + env.LLM_MODEL } },
            ]).slice(1, -1));
          });
        ')";
        node /app/dist/index.js config set --batch-json
        "[{\"path\":\"gateway.mode\",\"value\":\"local\"},
        {\"path\":\"gateway.bind\",\"value\":\"lan\"},
        {\"path\":\"gateway.publicOrigin\",\"value\":\"${OPENCLAW_PUBLIC_ORIGIN%/}\"},
        {\"path\":\"gateway.controlUi.allowedOrigins\",\"value\":[\"${OPENCLAW_PUBLIC_ORIGIN%/}\"]},
        {\"path\":\"gateway.trustedProxies\",\"value\":${OPENCLAW_TRUSTED_PROXIES}},
        {\"path\":\"gateway.auth.mode\",\"value\":\"trusted-proxy\"},
        {\"path\":\"gateway.auth.trustedProxy\",\"value\":{\"userHeader\":\"${OPENCLAW_IDENTITY_HEADER}\",\"deviceAutoApprove\":{\"enabled\":true,\"scopes\":[\"operator.read\",\"operator.write\",\"operator.approvals\",\"operator.questions\",\"operator.admin\"]}}},
        ${LLM_CONFIG}]";
        printf '%s' "$LLM_MODEL" > "$OPENCLAW_STATE_DIR/musher-connection-model";
        exec node openclaw.mjs gateway
    # One endpoint. The sandbox listener for dashboard widgets and MCP Apps (the
    # gateway port + 1) is not exposed: it needs a second public origin
    # (mcp.apps.sandboxOrigin, docs/cli/mcp/apps.md). So those frames do not load,
    # Doctor warns about it on every boot, and the listing says so.
    endpoints:
      primary:
        targetPort: 18789
        protocol: HTTP
    # Three stages (component §5.4). `startup` suspends the other two until it
    # passes, so neither can act on a container that is still booting.
    #
    # The platform's probes arrive from a peer inside `trustedProxies`, naming the
    # probing host in Forwarded and X-Forwarded-For (COMP-EP-017). A host with no
    # usable address sends neither header. The gateway answers both forms: since
    # 2026.10.8 a trusted peer reaches the probe routes before the
    # `proxy_attribution_required` rejection (src/gateway/server-http-request.ts,
    # docs/gateway/health.md). Before that, a headerless probe of /startupz got a
    # 403 and the deployment never became ready.
    health:
      startup:
        # /startupz is 200 once startup sidecars and agent-database inspection
        # have settled, and 503 while they are pending or the gateway is draining.
        #
        # Nothing listens until the boot command's Doctor and `config set` finish,
        # and running out of attempts restarts the container in the middle of
        # whatever it was doing. So the budget is sized from upstream's own
        # numbers for a new container on slow hardware: the state copy's 600 s cap
        # (docs/install/updating.md) plus 258 s of Doctor (the comment beside that
        # cap in src/commands/doctor-original-capture.ts). 30 + 96 x 10 = 990 s.
        http:
          endpoint: primary
          path: /startupz
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 96
      readiness:
        # /startupz and not /readyz, as upstream advises for traffic admission
        # (docs/install/docker.md). /readyz also fails on a hard channel failure,
        # which would take the whole Control UI out of routing because of one
        # broken channel account.
        http:
          endpoint: primary
          path: /startupz
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
      liveness:
        # The live routes are answered before the Control UI, auth and proxy
        # attribution, so /healthz returns JSON `{ok:true,status:"live"}`,
        # never the UI shell.
        http:
          endpoint: primary
          path: /healthz
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
    volumes:
      # Core state: openclaw.json, the SQLite databases (state/openclaw.sqlite and
      # agents/<id>/agent/openclaw-agent.sqlite, which hold connected-channel
      # OAuth tokens in plaintext, docs/install/docker/networking-and-storage.md),
      # paired devices, installed plugins and the agent workspace (default
      # /home/node/.openclaw/workspace lives inside this directory, so a single
      # claim covers config + workspace). This is the credential-bearing volume.
      config:
        minSizeGiB: 10
        mountPath: /home/node/.openclaw
      # The key that recovers legacy encrypted OAuth sidecars written by older
      # releases. Upstream keeps it outside the config directory and still mounts
      # it (docker-compose.yml, OPENCLAW_AUTH_PROFILE_SECRET_DIR), so a volume
      # carried over from one of those releases can still decrypt what it holds.
      auth-secrets:
        minSizeGiB: 1
        mountPath: /home/node/.config/openclaw
  contract:
    inputs:
      # ADR 0033: every value that reaches this workload enters through an
      # input, including the constants below. They carry defaults, so no
      # blueprint has to wire them and the deploy form gains no field.
      #
      # No mDNS advertising inside a container network (also auto-disabled when
      # the runtime detects a container; kept explicit for intent).
      disableBonjour:
        schema:
          type: string
        default: "1"
        target:
          envVar: OPENCLAW_DISABLE_BONJOUR
        description: >-
          Whether mDNS advertising is off, as the literal string the gateway
          runtime parses.
      # Upstream's own heap cap for a 2 GB machine (docs/install/fly.md,
      # v2026.11.2), so V8 collects before the node's memory limit is reached
      # rather than after.
      nodeOptions:
        schema:
          type: string
        default: --max-old-space-size=1536
        target:
          envVar: NODE_OPTIONS
        description: Options Node.js reads at startup; caps the gateway's heap at 1536 MiB.
      # State and config paths, pinned the way upstream compose pins them, so
      # they cannot drift from the volume mounts above if a default moves.
      stateDir:
        schema:
          type: string
        default: /home/node/.openclaw
        target:
          envVar: OPENCLAW_STATE_DIR
        description: Directory OpenClaw keeps its state in, the `config` volume's mount path.
      configPath:
        schema:
          type: string
        default: /home/node/.openclaw/openclaw.json
        target:
          envVar: OPENCLAW_CONFIG_PATH
        description: Path of the gateway's config file, on the `config` volume.
      # Local-only credential. In trusted-proxy mode nothing coming through the
      # edge can present it: a password is honoured only for loopback-direct
      # clients carrying no forwarding headers. It exists for the in-container
      # CLI (`openclaw status`, `openclaw devices list`), which upstream
      # directs to OPENCLAW_GATEWAY_PASSWORD rather than identity headers
      # (docs/gateway/trusted-proxy-auth.md).
      gatewayPassword:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVar: OPENCLAW_GATEWAY_PASSWORD
        description: >-
          Local credential for OpenClaw's CLI inside the container. Browsers
          are admitted by the platform edge's sign-in instead.
      # The two inputs below are the platform's half of trusted-proxy auth.
      # The blueprint binds them from this node's own `identityHeader` and
      # `trustedProxies` outputs. They carry no default: a literal here would
      # let the item run where the platform forwards no identity. Upstream
      # reads no env var for either, so the boot command writes them into
      # gateway.auth.trustedProxy.userHeader and gateway.trustedProxies.
      identityHeader:
        schema:
          type: string
        required: true
        target:
          envVar: OPENCLAW_IDENTITY_HEADER
        description: >-
          Request header in which the platform passes the signed-in viewer's
          identity.
      trustedProxies:
        schema:
          type: array
          items:
            type: string
        required: true
        target:
          envVar: OPENCLAW_TRUSTED_PROXIES
        description: >-
          CIDRs the platform's forwarded traffic arrives from. The identity
          header is trusted only on connections from these addresses.
      # Required because the boot command cannot succeed without it: `config set`
      # rejects an empty gateway.publicOrigin as an invalid URL, which fails the
      # boot under `set -e`.
      publicOrigin:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        required: true
        target:
          envVar: OPENCLAW_PUBLIC_ORIGIN
        description: >-
          Public https origin of this deployment, written into
          gateway.publicOrigin and gateway.controlUi.allowedOrigins on every boot
          so links use the public hostname and browser sessions from it are
          accepted.
      timezone:
        schema:
          type: string
        presentationHint: TIMEZONE
        default: UTC
        required: false
        # The container consumes the standard TZ variable (upstream compose maps
        # its host-side OPENCLAW_TZ input onto TZ; OPENCLAW_TZ itself is not read
        # by the gateway runtime).
        target:
          envVar: TZ
        description: IANA timezone for the agent's scheduled tasks and temporal reasoning.
      # The three inputs below carry one language-model connection. They are not
      # supplied independently: the blueprint wires all three to the outputs of
      # the `llm` node, which takes the connection whole (components/llm.yaml).
      # The env var names belong to this item. The boot command reads them into
      # OpenClaw's documented config (see the block above `command`).
      llmBaseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        target:
          envVar: LLM_BASE_URL
        description: >-
          Base URL of the OpenAI-compatible chat-completions API the agent sends
          model requests to, ending in the version segment (for example /v1).
      llmAPIKey:
        schema:
          type: string
        sensitive: true
        target:
          envVar: LLM_API_KEY
        description: Bearer credential for the API above.
      llmModel:
        schema:
          type: string
        target:
          envVar: LLM_MODEL
        description: Model the agent uses by default.
    outputs:
      # Platform facts of the `primary` allocation (component §5.2, COMP-EP-012).
      # Reading them here means any blueprint deploying this component must
      # forward viewer identity on `primary`, or it fails
      # ERR_VIEWER_IDENTITY_NOT_FORWARDED. So the item cannot run where the
      # header could be forged.
      identityHeader:
        schema:
          type: string
        description: >-
          Header the platform carries the signed-in viewer's identity in,
          bound back into this node's `identityHeader` input.
        from:
          endpoint: primary
          property: viewerIdentityHeader
      trustedProxies:
        schema:
          type: array
          items:
            type: string
        description: >-
          CIDRs the platform's forwarded traffic reaches this container from,
          bound back into this node's `trustedProxies` input.
        from:
          endpoint: primary
          property: trustedProxyCIDRs
      publicURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Public https origin this deployment answers at, as the platform
          allocated it. The blueprint binds it back into this node's own
          `publicOrigin` input.
        from:
          endpoint: primary
          property: publicURL

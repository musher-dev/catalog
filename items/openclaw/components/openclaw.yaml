specVersion: v1
kind: COMPONENT
metadata:
  revision: 7
  description: OpenClaw agent gateway and Control UI behind the platform edge's sign-in, with its config, sessions and credentials on two volumes.
spec:
  type: SERVICE
  workload:
    source:
      # PINNED. 2026.9.6 is the latest stable release (2026-09-23). The tag on
      # ghcr carries no `v` prefix.
      #
      # This item previously sat on 2026.7.1 because it relied on
      # `gateway.controlUi.dangerouslyDisableDeviceAuth`, which 2026.8.x made
      # inert: at 2026.9.6 `shouldSkipControlUiPairing`
      # (src/gateway/server/ws-connection/connect-policy.ts) returns only
      # "tailscale-device", "auth-none" or null, and `doctor --fix` deletes the
      # key as retired. Browsers are admitted here by trusted-proxy auth with
      # `deviceAutoApprove` instead (see the block above `command`).
      #
      # Before bumping past 2026.9.6, check two things. `main` moves the
      # ENTRYPOINT to `tini -s -- node /app/docker-entrypoint.mjs`, which runs
      # `doctor --fix --non-interactive` itself and may not pass `sh -c`
      # through the way `tini -s --` does. And re-read the pairing plan
      # (src/gateway/server/ws-connection/connect-pairing-approval-plan.ts) for
      # the trusted-proxy auto-approve lane.
      image: ghcr.io/openclaw/openclaw:2026.9.6
    # Converge config through OpenClaw's own `config set` CLI, then exec the
    # stock gateway entrypoint (`tini -s --` passes argv through, so `sh -c` works).
    #
    # The Control UI origin allowlist (`gateway.controlUi.allowedOrigins`) is
    # CONFIG-FILE-ONLY: no env var sets it. At 2026.9.6 a non-loopback bind
    # with the Control UI on refuses to start without it
    # (src/gateway/server-runtime-config.ts). The newer `gateway.publicOrigin`
    # key does not feed it, so it is not set here.
    #
    # `config set` (not a hand-written openclaw.json) is what upstream's own
    # container guide uses (docs/install/docker.md), and it is the only form
    # that works: the CLI writes a normalized document carrying the
    # `meta.lastTouchedVersion` stamp the gateway expects, whereas a hand-rolled
    # file is rejected as clobbered config ("existing config is missing
    # gateway.mode").
    #
    # `gateway.bind=lan` is set explicitly. In a container the default is
    # `auto` (src/gateway/net.ts `defaultGatewayBindMode`), and the platform
    # edge is a separate network hop, so the listener must be on a routable
    # interface. OPENCLAW_GATEWAY_BIND is not set: it is a compose-file
    # variable that the gateway runtime does not read.
    #
    # Run unconditionally on every boot rather than behind a first-boot guard:
    # the config lives on a persistent volume, so a guard would pin the very first
    # boot's origin forever and leave a re-deployed app permanently unreachable.
    # `config set` is declarative, so re-applying is a no-op.
    #
    # DOCTOR FIRST. At 2026.9.x `config set` refuses to write over an invalid
    # existing config and points at `doctor --fix`. Since 2026.9.5 some
    # conversions (older conversations, pairing records, file-based queues) wait
    # for an explicit doctor run and no longer happen on restart alone. A volume
    # carried over from 2026.7.1 needs both. `--non-interactive` applies the
    # startup-blocking migrations without prompting and exits 1 when a repair
    # is incomplete. That exit is reported and not fatal, so it cannot become
    # a crash loop. If state really cannot be migrated, the gateway exits 78
    # on its own.
    #
    # ACCESS: TRUSTED-PROXY. There is no token screen. The platform edge signs
    # the viewer in, strips any client-supplied copy of the identity header and
    # of Forwarded / X-Forwarded-* / X-Real-IP, and injects the identity header
    # on HTTP requests and WebSocket upgrades (musher-dev/platform#3149). The
    # gateway (docs/gateway/trusted-proxy-auth.md, v2026.9.6) accepts that
    # header only when:
    #
    #   1. the TCP peer is inside `gateway.trustedProxies` (the edge's source
    #      CIDRs, musher-dev/infra#645), else `proxy_attribution_required`;
    #   2. the peer is neither loopback nor one of this container's own
    #      interface addresses;
    #   3. the header is present and non-blank.
    #
    # `deviceAutoApprove` then pairs the browser silently, so a first visit
    # lands connected, and every browser is a revocable paired device again.
    #
    # `operator.admin` is listed in the auto-approve scopes deliberately. The
    # person who deploys this is its owner and needs admin to configure the
    # agent. The edge admits only members of the deployment's own organization.
    # This matches the old posture, where the token was full admin.
    # `openclaw security audit` reports it as the CRITICAL
    # `gateway.trusted_proxy_device_auto_approve_admin` finding, and the gateway
    # logs a warning at startup. That is expected here, not a regression. Once
    # the edge can send a role, `x-openclaw-scopes` or `identityScopes` can
    # narrow it per user.
    #
    # The whole boundary is the edge plus edge-only ingress. The header is only
    # trustworthy if nothing but the edge can reach port 18789.
    #
    # THE LANGUAGE MODEL. It arrives as the `llm` connection declared at the
    # foot of this file, in three env vars this item names (LLM_BASE_URL,
    # LLM_API_KEY, LLM_MODEL). Upstream reads no env var for a provider's base
    # URL or a default model, so there is no upstream name to target. The boot
    # command writes the three into OpenClaw's documented custom-provider shape
    # instead (docs/concepts/model-providers.md, "Local proxies"):
    #
    #   - models.providers.llm, with `api: openai-completions`. The OpenAI SDK
    #     appends /chat/completions to baseUrl, so a base ending /v1 is what it
    #     wants. On a host other than api.openai.com, OpenClaw also drops the
    #     developer role and OpenAI-only request shaping.
    #   - `apiKey` is written as the literal string `${LLM_API_KEY}` (the `\$`
    #     keeps sh from expanding it). OpenClaw substitutes it from the process
    #     env at config load (docs/gateway/configuration-reference.md, "Env var
    #     substitution"), so the credential never lands in openclaw.json on the
    #     volume.
    #   - One model entry, `reasoning: false` and `input: [text]`, stated even
    #     though they are the custom-provider defaults. The connection supplies
    #     neither thinking nor vision, and this keeps OpenClaw from asking for
    #     either.
    #   - agents.defaults.model, as the whole object rather than `.primary`, so
    #     it succeeds under `set -e` whatever shape a UI edit left behind. At
    #     2026.9.x `config set` resolves model refs before writing. `llm/<model>`
    #     resolves because the provider is written in the same batch, but a
    #     model id OpenClaw cannot parse fails the boot here, visibly.
    #
    # Because the batch runs on every boot, the connection is authoritative.
    # A rotated credential or replaced connection takes effect at the next
    # restart. A default model chosen in the Control UI does not survive one,
    # and the listing says so.
    #
    # Exec form: argv, no shell of the platform's own. The shell this needs is
    # the one named here. The script uses `${VAR%/}` to strip a trailing slash
    # off the origin, and sed to turn the comma-separated proxy list into
    # JSON array members.
    command:
      - sh
      - -c
      - >-
        set -e;
        node /app/dist/index.js doctor --fix --non-interactive
        || echo "openclaw: doctor --fix reported an incomplete repair; continuing" >&2;
        proxies=$(printf '%s' "$OPENCLAW_TRUSTED_PROXIES" | sed 's/[[:space:]]//g; s/,/","/g');
        node /app/dist/index.js config set --batch-json
        "[{\"path\":\"gateway.mode\",\"value\":\"local\"},
        {\"path\":\"gateway.bind\",\"value\":\"lan\"},
        {\"path\":\"gateway.controlUi.allowedOrigins\",\"value\":[\"${OPENCLAW_PUBLIC_ORIGIN%/}\"]},
        {\"path\":\"gateway.trustedProxies\",\"value\":[\"${proxies}\"]},
        {\"path\":\"gateway.auth.mode\",\"value\":\"trusted-proxy\"},
        {\"path\":\"gateway.auth.trustedProxy\",\"value\":{\"userHeader\":\"${OPENCLAW_IDENTITY_HEADER}\",\"deviceAutoApprove\":{\"enabled\":true,\"scopes\":[\"operator.read\",\"operator.write\",\"operator.approvals\",\"operator.questions\",\"operator.admin\"]}}},
        {\"path\":\"models.providers.llm\",\"value\":{\"baseUrl\":\"${LLM_BASE_URL%/}\",\"api\":\"openai-completions\",\"apiKey\":\"\${LLM_API_KEY}\",\"models\":[{\"id\":\"${LLM_MODEL}\",\"name\":\"${LLM_MODEL}\",\"reasoning\":false,\"input\":[\"text\"]}]}},
        {\"path\":\"agents.defaults.model\",\"value\":{\"primary\":\"llm/${LLM_MODEL}\"}}]";
        exec node openclaw.mjs gateway
    endpoints:
      primary:
        targetPort: 18789
        protocol: HTTP
    health:
      readiness:
        # /startupz is upstream's orchestrator gate (docs/install/docker.md,
        # v2026.9.6): 503 while startup, migrations included, is still settling,
        # then 200. /readyz also turns 503 on plugin reloads and failed channels,
        # which suits monitoring better than routing.
        http:
          endpoint: primary
          path: /startupz
        # Node boot, doctor and SQLite migrations run before the gate opens.
        initialDelaySeconds: 45
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
      liveness:
        # Probe routes are answered before the Control UI and need no auth, so
        # /healthz returns JSON `{ok:true,status:"live"}`, never the UI shell.
        http:
          endpoint: primary
          path: /healthz
        # Nothing listens while the boot command's doctor and config runs are
        # still going. Without this delay, three failures 30s apart would
        # restart a container in the middle of a first-boot migration.
        initialDelaySeconds: 120
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
    volumes:
      # Core state: openclaw.json, SQLite session DBs (which, at 2026.9.x, hold
      # connected-channel OAuth tokens in plaintext), paired devices, installed
      # plugins and the agent workspace (default /home/node/.openclaw/workspace
      # lives inside this directory, so a single claim covers config +
      # workspace). This is the credential-bearing volume.
      config:
        minSizeGiB: 10
        mountPath: /home/node/.openclaw
      # The key that recovers legacy encrypted OAuth sidecars written by
      # releases before 2026.9. Upstream keeps it outside the config directory
      # and still mounts it (docker-compose.yml), so a volume carried over from
      # 2026.7.1 can still decrypt what it holds.
      auth-secrets:
        minSizeGiB: 1
        mountPath: /home/node/.config/openclaw
  contract:
    inputs:
      # ADR 0033: every value that reaches this workload enters through an
      # input, including the constants below. They carry defaults, so no
      # blueprint has to wire them and the install form gains no field.
      #
      # No mDNS advertising inside a container network (also auto-disabled when
      # the runtime detects a container; kept explicit for intent).
      disableBonjour:
        schema:
          type: string
        default: "1"
        target:
          envVarKey: OPENCLAW_DISABLE_BONJOUR
        description: >-
          Whether mDNS advertising is off, as the literal string the gateway
          runtime parses.
      # State and config paths, pinned the way upstream compose pins them, so
      # they cannot drift from the volume mounts above if a default moves.
      stateDir:
        schema:
          type: string
        default: /home/node/.openclaw
        target:
          envVarKey: OPENCLAW_STATE_DIR
        description: Directory OpenClaw keeps its state in, the `config` volume's mount path.
      configPath:
        schema:
          type: string
        default: /home/node/.openclaw/openclaw.json
        target:
          envVarKey: OPENCLAW_CONFIG_PATH
        description: Path of the gateway's config file, on the `config` volume.
      # Local-only credential. In trusted-proxy mode nothing coming through the
      # edge can present it: a password is honoured only for loopback-direct
      # clients carrying no forwarding headers. It exists for the in-container
      # CLI (`openclaw status`, `openclaw devices list`), which upstream
      # directs to OPENCLAW_GATEWAY_PASSWORD rather than identity headers
      # (docs/gateway/trusted-proxy-auth.md).
      gatewayPassword:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: OPENCLAW_GATEWAY_PASSWORD
        description: >-
          Local credential for OpenClaw's CLI inside the container. Browsers
          are admitted by the platform edge's sign-in instead.
      # The two inputs below are the edge's half of trusted-proxy auth.
      # Upstream reads no env var for either, so the boot command writes them
      # into gateway.trustedProxies and gateway.auth.trustedProxy.userHeader.
      identityHeader:
        schema:
          type: string
        default: x-musher-user
        target:
          envVarKey: OPENCLAW_IDENTITY_HEADER
        description: >-
          Request header in which the platform edge passes the signed-in
          user's identity.
      trustedProxies:
        schema:
          type: string
        required: true
        target:
          envVarKey: OPENCLAW_TRUSTED_PROXIES
        description: >-
          Comma-separated IPs or CIDRs the platform edge connects from. The
          identity header is trusted only on connections from these addresses.
      publicOrigin:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        required: false
        target:
          envVarKey: OPENCLAW_PUBLIC_ORIGIN
        description: >-
          Public https origin of this deployment's Control UI, written into
          gateway.controlUi.allowedOrigins on every boot so browser sessions
          from the public hostname are accepted.
      timezone:
        schema:
          type: string
        presentationHint: TIMEZONE
        default: UTC
        required: false
        # The container consumes the standard TZ variable (upstream compose maps
        # its host-side OPENCLAW_TZ input onto TZ; OPENCLAW_TZ itself is not read
        # by the gateway runtime).
        target:
          envVarKey: TZ
        description: IANA timezone for the agent's scheduled tasks and temporal reasoning.
      # The three inputs below carry one language-model connection. They are not
      # supplied independently: the blueprint wires all three to the outputs of
      # the `llm` node, which takes the connection whole (components/llm.yaml).
      # The env var names belong to this item. The boot command reads them into
      # OpenClaw's documented config (see the block above `command`).
      llmBaseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        target:
          envVarKey: LLM_BASE_URL
        description: >-
          Base URL of the OpenAI-compatible chat-completions API the agent sends
          model requests to, ending in the version segment (for example /v1).
      llmAPIKey:
        schema:
          type: string
        sensitive: true
        target:
          envVarKey: LLM_API_KEY
        description: Bearer credential for the API above.
      llmModel:
        schema:
          type: string
        target:
          envVarKey: LLM_MODEL
        description: Model the agent uses by default.
    outputs:
      publicURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Public https origin this deployment's Control UI answers at, as the
          platform allocated it. The blueprint binds it back into this node's own
          allowlist.
        from:
          endpoint: primary
          property: publicURL

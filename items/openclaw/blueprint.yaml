specVersion: v1
kind: BLUEPRINT
metadata:
  slug: openclaw
  revision: 8
  description: >-
    OpenClaw agent gateway on the installer's language-model connection, reached
    through the platform's sign-in with the viewer's identity forwarded, with
    its own public origin in the Control UI allowlist.
spec:
  components:
    llm:
      componentRef: ./components/llm.yaml
      # No compute, no volumes, no exposure: an EXTERNAL node runs nothing
      # (BP-NODE-002). It stands for the model API and publishes the three
      # members of the one connection it is given.
      bindings:
        llm:
          parameter: llm
    web:
      componentRef: ./components/openclaw.yaml
      compute:
        profile: general.standard.small
      volumes:
        config:
          sizeGiB: 10
        auth-secrets:
          sizeGiB: 1
      # Signed in, with identity forwarded (blueprint §4.5, ADR 0034). The
      # platform authenticates every request and WebSocket upgrade before
      # forwarding it, and sets the viewer-identity header OpenClaw's
      # trusted-proxy mode reads. There is no token screen. The component reads
      # the header name and proxy CIDRs from this endpoint, so a bare `PUBLIC`
      # here fails ERR_VIEWER_IDENTITY_NOT_FORWARDED rather than deploying an
      # item whose header anyone could forge.
      exposure:
        primary:
          visibility: PUBLIC
          access: AUTHENTICATED
          viewerIdentity: HEADER
      bindings:
        gatewayPassword:
          parameter: gatewayPassword
        # The platform's facts of this node's own `primary` allocation: the
        # header it forwards the viewer's identity in, and the only peers
        # OpenClaw accepts that header from. Like `publicOrigin` below, a node
        # reading its own endpoint outputs is a discovery dependency and not a
        # value cycle.
        identityHeader:
          node: web
          output: identityHeader
        trustedProxies:
          node: web
          output: trustedProxies
        timezone:
          parameter: timezone
        # This node's own allocated origin, from the output the component derives
        # from its `primary` endpoint, written into
        # gateway.controlUi.allowedOrigins by the boot command. A node reading
        # its own endpoint output is a discovery dependency and not a value
        # cycle (BP-CONN-002): the address is allocated before anything runs.
        publicOrigin:
          node: web
          output: publicURL
        # The three members of the one connection the `llm` node holds. Wiring
        # them from one node is what keeps them consistent: an address from one
        # provider beside a key from another would have to be written here, in
        # the open, rather than assembled silently.
        llmBaseURL:
          node: llm
          output: baseURL
        llmAPIKey:
          node: llm
          output: apiKey
        llmModel:
          node: llm
          output: model
  parameters:
    # The language model the agent runs on: endpoint, credential and model
    # acquired together as one connection, defaulting to the organization's. A
    # connection parameter binds only to a connection input, and the `llm`
    # node's is the only one here (BP-CONNECTION-001).
    llm:
      from: "${{ connections.llm.default }}"
      ui:
        label: Language model
        order: 1
    # Local gateway password: auto-minted at deploy and shown on the Configuration
    # tab. Browsers never need it; the platform edge signs them in. It is for the
    # OpenClaw CLI inside the container, which authenticates to the gateway over
    # loopback. 32 bytes of hex == 64 characters, matching the project's
    # `openssl rand -hex 32` guidance.
    gatewayPassword:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Gateway password (in-container CLI)
        order: 2
    timezone:
      default: UTC
      ui:
        label: Timezone
        order: 3
        examples:
          - UTC
          - Europe/London
          - America/New_York

specVersion: v1
kind: BLUEPRINT
metadata:
  slug: openclaw
  revision: 5
  description: OpenClaw agent gateway on the installer's language-model connection, behind a generated master token, with its own public origin in the Control UI allowlist.
spec:
  components:
    llm:
      componentRef: ./components/llm.yaml
      # No compute, no volumes, no exposure: an EXTERNAL node runs nothing
      # (BP-NODE-002). It stands for the model API and publishes the three
      # members of the one connection it is given.
      bindings:
        llm:
          parameter: llm
    web:
      componentRef: ./components/openclaw.yaml
      compute:
        profile: general.standard.small
      volumes:
        config:
          sizeGiB: 10
        auth-secrets:
          sizeGiB: 1
      exposure:
        primary: PUBLIC
      bindings:
        gatewayToken:
          parameter: gatewayToken
        timezone:
          parameter: timezone
        # This node's own allocated origin, from the output the component derives
        # from its `primary` endpoint, written into
        # gateway.controlUi.allowedOrigins by the boot command. A node reading
        # its own endpoint output is a discovery dependency and not a value
        # cycle (BP-CONN-002): the address is allocated before anything runs.
        publicOrigin:
          node: web
          output: publicURL
        # The three members of the one connection the `llm` node holds. Wiring
        # them from one node is what keeps them consistent: an address from one
        # provider beside a key from another would have to be written here, in
        # the open, rather than assembled silently.
        llmBaseURL:
          node: llm
          output: baseURL
        llmAPIKey:
          node: llm
          output: apiKey
        llmModel:
          node: llm
          output: model
  parameters:
    # The language model the agent runs on: endpoint, credential and model
    # acquired together as one connection, defaulting to the organization's. A
    # connection parameter binds only to a connection input, and the `llm`
    # node's is the only one here (BP-CONNECTION-001).
    llm:
      from: "${{ connections.llm.default }}"
      ui:
        label: Language model
        order: 1
    # Master gateway token: auto-minted at deploy, shown on the Configuration tab, and
    # pasted into the Control UI on first visit. 32 bytes of hex == a 64-char token,
    # matching the project's `openssl rand -hex 32` guidance.
    gatewayToken:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: Gateway token
        order: 2
    timezone:
      default: UTC
      ui:
        label: Timezone
        order: 3
        examples:
          - UTC
          - Europe/London
          - America/New_York

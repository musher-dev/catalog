specVersion: v1
kind: LISTING
metadata:
  slug: openclaw
  version: 2
spec:
  listingKind: BLUEPRINT
  displayName: OpenClaw
  summary: Self-hosted AI agent gateway with a browser Control UI, bring-your-own model keys
  description: |
    ## What it is
    OpenClaw (formerly Clawdbot/Moltbot) is a self-hosted AI agent gateway.
    It connects your own LLM API keys (OpenAI, Anthropic, local models) to
    a browser-based Control UI with stateful memory, scheduled tasks, and
    tool execution — a private, always-on assistant rather than a hosted
    chatbot subscription.

    ## When to use
    - You want a persistent AI assistant on infrastructure you control,
      with keys, config, and session history staying on your deployment.
    - You want an agent that runs scheduled tasks and tools around the
      clock, not just while a chat tab is open.
    - You're experimenting with agent workflows across multiple model
      providers behind one gateway.

    ## Defaults
    Two containers: `ghcr.io/openclaw/openclaw:2026.8.2` running the agent
    gateway, and a `caddy:2.10.2-alpine` sign-in proxy in front of it. Only
    the proxy is reachable from the internet; the gateway listens on the
    deployment's private mesh and can be reached solely through it.

    Pick a username and password at install time and you're done — open the
    URL, sign in, and add your model-provider keys under Settings. Two
    persistent volumes (10 GiB at `/home/node/.openclaw`, 1 GiB at
    `/home/node/.config/openclaw`) keep configuration, session history, and
    the OAuth-token encryption key across restarts.

    ## Access and security
    Sign in with the username and password you chose. There is no token to
    copy, no per-device approval, and no setup step after deploying — any
    device can sign in, and the browser is enrolled automatically as part of
    signing in.

    A default OpenClaw install works differently: it requires a shared token
    and then a one-time approval of each new browser, run as
    `openclaw devices approve` on the Gateway host. A one-click deployment
    gives you no host shell for that. Here the proxy authenticates you and
    passes your identity to the gateway, which trusts it and enrols your
    browser during the handshake, so the approval never surfaces.

    Your password is stored only as a bcrypt hash inside the running
    container, and the proxy overwrites the identity header on every request,
    so a browser cannot forge one. The password guards an admin surface that
    can run tools and shell commands, so choose a strong one — at least 16
    characters is enforced — and don't reuse it.

    Messaging-channel onboarding (WhatsApp, Telegram, Discord) requires
    the interactive CLI and is not available in this deployment yet.

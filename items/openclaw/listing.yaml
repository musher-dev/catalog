specVersion: v1
kind: LISTING
metadata:
  slug: openclaw
spec:
  itemType: BLUEPRINT
  displayName: OpenClaw
  summary: Self-hosted AI agent gateway with a browser Control UI, running on your organization's language model
  description: |
    ## What it is
    OpenClaw (formerly Clawdbot/Moltbot) is a self-hosted AI agent gateway.
    It puts a language model behind a browser-based Control UI with stateful
    memory, scheduled tasks, and tool execution — a private, always-on
    assistant rather than a hosted chatbot subscription.

    ## When to use
    - You want a persistent AI assistant on infrastructure you control,
      with keys, config, and session history staying on your deployment.
    - You want an agent that runs scheduled tasks and tools around the
      clock, not just while a chat tab is open.
    - You're experimenting with agent workflows across multiple model
      providers behind one gateway.

    ## What you'll be asked for
    A **language model**, chosen once. It defaults to your organization's
    model connection. The address, the credential and the model name travel
    together as a single connection, so the agent never holds a key from one
    provider beside an address from another. Anything speaking the OpenAI
    chat-completions protocol with streaming and tool calls will do,
    including an engine you run yourself.

    The connection is written into OpenClaw's configuration each time it
    starts, so a rotated credential or a replaced connection takes effect on
    the next restart. For the same reason, a different default model picked in
    the Control UI reverts to the connection's model on restart.

    ## Defaults
    Single-container deployment of `ghcr.io/openclaw/openclaw:2026.9.6`
    with the Control UI on port 18789 behind the platform's HTTPS edge.
    Open the deployment's URL and you land in the Control UI, already
    connected. There is no token to copy. The agent is already on the
    language model you chose. The deployment's public origin is written into
    the gateway's browser-origin allowlist automatically. Two persistent
    volumes (10 GiB at `/home/node/.openclaw`, 1 GiB at
    `/home/node/.config/openclaw`) keep configuration, session history,
    paired browsers and connected-channel credentials across restarts. The
    smaller one holds only the key for credentials written by older
    releases.

    ## Access and security
    Signing in to Musher is what gets you in. The platform admits only people
    its access policy allows for this deployment. It tells OpenClaw who you
    are, and OpenClaw trusts that only on connections arriving through the
    platform, so the Control UI is never open to an unauthenticated visitor.

    A default OpenClaw install asks you to approve each new browser once by
    running `openclaw devices approve` on the Gateway host. Here the signed-in
    identity is the approval, so a new browser is paired automatically the
    first time you open the URL. Each browser is still its own paired device,
    and you can review or revoke devices from the Control UI.

    Everyone the platform admits gets full admin over an agent that can run
    tools and shell commands. `openclaw security audit` flags that as
    critical, and here it is intended. Limit who can open the deployment
    accordingly. A browser stays paired after its user loses access, so
    revoke devices you no longer trust from the Control UI.

    The Installation tab also shows a generated gateway password. Browsers
    never need it. It is for the OpenClaw CLI inside the container.

    Messaging-channel onboarding (WhatsApp, Telegram, Discord) requires
    the interactive CLI and is not available in this deployment yet.

specVersion: v1
kind: COMPONENT
metadata:
  revision: 4
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: heartexlabs/label-studio:1.23.0
    endpoints:
      primary:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /health
        endpoint: primary
        # First boot runs the full Django migration chain against SQLite —
        # several minutes on a nano profile — so the gate opens late and the
        # budget must outlast it (observed ~3-4 min to first listen in live E2E).
        # failureThreshold is capped at 10 by the probe schema, so the wait
        # is carried by the initial delay rather than by more retries.
        initialDelaySeconds: 240
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    envVars:
      - key: LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK
        value:
          type: LITERAL
          value: 'true'
    volumes:
      data:
        sizeGiB: 10
        mountPath: /label-studio/data
  contract:
    inputs:
      adminEmail:
        schema:
          type: STRING
          format: EMAIL
        required: true
        target:
          envVarKey: LABEL_STUDIO_USERNAME
        description: Email address for the bootstrap admin account
      adminPassword:
        schema:
          type: STRING
          sensitive: true
        required: true
        target:
          envVarKey: LABEL_STUDIO_PASSWORD
        description: Password for the bootstrap admin account; rotate from the
          Configuration tab
      # The two inputs below both bind this deployment's own public URL, into
      # two settings Label Studio reads independently — base.py makes one
      # get_env call for HOST and a separate one for CSRF_TRUSTED_ORIGINS. Only
      # the second unblocks the login form; the first fixes the absolute links
      # Label Studio builds. Setting the host alone, which is the obvious first
      # move, leaves the trusted-origin list empty and the 403 where it was.
      #
      # Why there is a 403 at all: TLS terminates at the gateway and the
      # container serves plain HTTP on 8080. 1.23.0 sets no
      # SECURE_PROXY_SSL_HEADER and exposes no env var for one, so
      # request.is_secure() is False and Django composes its expected origin as
      # http://<host> while the browser sends https://<host>. A scheme mismatch
      # has exactly one escape hatch, and it is CSRF_TRUSTED_ORIGINS.
      #
      # It shows up only at the front door. core.middleware.DisableCSRF sets
      # _dont_enforce_csrf_checks on every request, so CsrfViewMiddleware
      # accepts everything except the views carrying @enforce_csrf_checks —
      # which is exactly user_login and user_signup (users/views.py). Every GET
      # succeeds and the readiness probe passes; only the login POST is
      # rejected. That is why the item deploys clean and is still unusable.
      publicUrl:
        schema:
          type: STRING
          format: ENDPOINT_URL
        required: false
        target:
          envVarKey: LABEL_STUDIO_HOST
        description: >-
          Public base URL Label Studio builds absolute links from. Override only
          for a custom domain.
      # No `format` here, deliberately: the value is a comma-separated list, and
      # every member of the format vocabulary names a convention the whole
      # scalar follows. A two-origin list is not a URL, and blueprint 5.3 binds
      # a client's rendering -- one told this was a single URL could normalise
      # or trim it and corrupt the list. The shape lives in the covering
      # parameter's ui.examples instead, beside the default that supplies it.
      csrfTrustedOrigins:
        schema:
          type: STRING
        required: false
        target:
          envVarKey: LABEL_STUDIO_CSRF_TRUSTED_ORIGINS
        description: >-
          Comma-separated origins Django accepts form POSTs from. Must match the
          browser's Origin header exactly — scheme included, no trailing slash.
      # SECRET_KEY takes no LABEL_STUDIO_ prefix. It is read through environ.Env
      # in core/utils/secret_key.py rather than through get_env's
      # LABEL_STUDIO_/HEARTEX_/bare lookup chain, so this env var name is the
      # only one that reaches it.
      #
      # Left unset, Label Studio mints a key and appends it to
      # /label-studio/data/.env. That is inside this item's volume, so it does
      # survive a restart — but it is per-volume: a second replica mints its
      # own, and sessions and CSRF tokens stop validating across the two.
      # read_env() populates the environment with setdefault, so an explicit
      # value here wins over a key already persisted in that file, at the cost
      # of invalidating live sessions once.
      secretKey:
        schema:
          type: STRING
          sensitive: true
        required: true
        target:
          envVarKey: SECRET_KEY
        description: >-
          Django secret key signing sessions and CSRF tokens. Pinning it keeps
          sessions valid across replicas and re-creates.
    outputs: {}

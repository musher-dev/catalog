specVersion: v1
kind: COMPONENT
metadata:
  revision: 7
  description: Label Studio data-labelling platform, with its database and media on one volume.
spec:
  type: SERVICE
  workload:
    source:
      image: heartexlabs/label-studio:1.23.0
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /health
        # First boot runs the full Django migration chain against SQLite —
        # several minutes — so the gate opens late and the budget must outlast
        # it (observed ~3-4 min to first listen in live E2E). The wait is
        # carried by the initial delay rather than by more retries, the same
        # shape as open-webui and mlflow.
        initialDelaySeconds: 240
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    volumes:
      data:
        minSizeGiB: 10
        mountPath: /label-studio/data
  contract:
    inputs:
      # ADR 0033: every value that reaches this workload enters through an
      # input, including the constants below. They carry defaults, so no
      # blueprint has to wire them and the install form gains no field.
      disableSignupWithoutLink:
        schema:
          type: string
        default: 'true'
        target:
          envVarKey: LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK
        description: >-
          Whether signup is restricted to holders of an invite link, as the
          literal string the image parses.
      # Browsers only ever reach this deployment over https at the platform
      # edge, so the session cookie can be Secure. The value is '1', not
      # 'true': base.py:470 parses it with int() before label_studio.py:27
      # re-reads it as a bool, and int('true') would fail at settings import.
      # That is also why these stay string inputs: the literal matters.
      # CSRF_COOKIE_SECURE follows it (base.py:473), which is wanted.
      sessionCookieSecure:
        schema:
          type: string
        default: '1'
        target:
          envVarKey: LABEL_STUDIO_SESSION_COOKIE_SECURE
        description: >-
          Whether the session cookie is marked Secure, as the integer-parsed
          literal the image expects.
      # CSRF_COOKIE_HTTPONLY would follow SESSION_COOKIE_SECURE too
      # (base.py:474), and it is pinned at its current '0' so the frontend
      # reads the CSRF cookie exactly as before.
      csrfCookieHTTPOnly:
        schema:
          type: string
        default: '0'
        target:
          envVarKey: LABEL_STUDIO_CSRF_COOKIE_HTTPONLY
        description: >-
          Whether the CSRF cookie is marked HttpOnly, as the integer-parsed
          literal the image expects.
      # Both admin inputs take effect ONCE, when the account is created. With
      # a username set, 1.23.0's _create_user (label_studio/server.py) calls
      # create_user, and for an existing email the IntegrityError is only
      # printed as "already exists": the stored password is never updated. A
      # changed email is a new account, created as a second superuser and
      # added to the same organization. Rotate the password from Label
      # Studio's own account settings.
      adminEmail:
        schema:
          type: string
        presentationHint: EMAIL
        required: true
        target:
          envVarKey: LABEL_STUDIO_USERNAME
        description: Email address for the bootstrap admin account
      adminPassword:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: LABEL_STUDIO_PASSWORD
        description: >-
          Password the bootstrap admin account is created with. Changing it
          after the first boot has no effect; change it in Label Studio.
      # The two inputs below both bind this deployment's own public URL, into
      # two settings Label Studio reads independently — base.py makes one
      # get_env call for HOST and a separate one for CSRF_TRUSTED_ORIGINS. Only
      # the second unblocks the login form; the first fixes the absolute links
      # Label Studio builds. Setting the host alone, which is the obvious first
      # move, leaves the trusted-origin list empty and the 403 where it was.
      #
      # Why there is a 403 at all: TLS terminates at the gateway and the
      # container serves plain HTTP on 8080. 1.23.0 sets no
      # SECURE_PROXY_SSL_HEADER and exposes no env var for one, so
      # request.is_secure() is False and Django composes its expected origin as
      # http://<host> while the browser sends https://<host>. A scheme mismatch
      # has exactly one escape hatch, and it is CSRF_TRUSTED_ORIGINS.
      #
      # It shows up only at the front door. core.middleware.DisableCSRF sets
      # _dont_enforce_csrf_checks on every request, so CsrfViewMiddleware
      # accepts everything except the views carrying @enforce_csrf_checks —
      # which is exactly user_login and user_signup (users/views.py). Every GET
      # succeeds and the readiness probe passes; only the login POST is
      # rejected. That is why the item deploys clean and is still unusable.
      publicURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        required: false
        target:
          envVarKey: LABEL_STUDIO_HOST
        description: >-
          Public base URL Label Studio builds absolute links from.
      # No `presentationHint` here, deliberately: the value is a comma-separated
      # list, and every member of that vocabulary names a convention the whole
      # scalar follows. A two-origin list is not a URL, and blueprint 5.3 binds
      # a client's rendering — one told this was a single URL could normalise
      # or trim it and corrupt the list. The shape lives in the binding's
      # comment instead, beside the output that supplies it.
      csrfTrustedOrigins:
        schema:
          type: string
        required: false
        target:
          envVarKey: LABEL_STUDIO_CSRF_TRUSTED_ORIGINS
        description: >-
          Comma-separated origins Django accepts form POSTs from. Must match the
          browser's Origin header exactly — scheme included, no trailing slash.
      # SECRET_KEY takes no LABEL_STUDIO_ prefix. It is read through environ.Env
      # in core/utils/secret_key.py rather than through get_env's
      # LABEL_STUDIO_/HEARTEX_/bare lookup chain, so this env var name is the
      # only one that reaches it.
      #
      # Left unset, Label Studio mints a key and appends it to
      # /label-studio/data/.env. That is inside this item's volume, so it does
      # survive a restart — but it is per-volume: a second replica mints its
      # own, and sessions and CSRF tokens stop validating across the two.
      # read_env() populates the environment with setdefault, so an explicit
      # value here wins over a key already persisted in that file, at the cost
      # of invalidating live sessions once.
      secretKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: SECRET_KEY
        description: >-
          Django secret key signing sessions and CSRF tokens. Pinning it keeps
          sessions valid across replicas and re-creates.
    outputs:
      publicURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: >-
          Public base URL this deployment answers at, as the platform allocated
          it. The blueprint binds it straight back into this node's own
          LABEL_STUDIO_HOST and CSRF trusted-origin list.
        from:
          endpoint: primary
          property: publicURL

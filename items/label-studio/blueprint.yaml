specVersion: v1
kind: BLUEPRINT
metadata:
  slug: label-studio
  revision: 3
spec:
  components:
    web:
      componentRef: ./components/label-studio.yaml
      size: general.standard.small
      connections: {}
  parameters:
    adminEmail:
      ui:
        label: Admin email
        order: 1
    adminPassword:
      generator:
        byteLength: 24
        encoding: ALPHANUMERIC
      ui:
        label: Admin password
        order: 2
    secretKey:
      generator:
        byteLength: 32
        encoding: ALPHANUMERIC
      ui:
        label: Secret key
        order: 3
    publicUrl:
      default: "${{ self.publicUrl }}"
      ui:
        label: Public URL
        order: 4
        prominence: SECONDARY
        examples:
          - https://label-studio.example.com
    # self.publicUrl has to resolve WITHOUT a trailing slash for this to work.
    # Django keeps the non-wildcard entries in a set and tests the browser's
    # Origin header for exact membership (allowed_origins_exact, matched in
    # CsrfViewMiddleware._origin_verified); an Origin header never carries a
    # trailing slash, so "https://host/" matches nothing and fails exactly as
    # an unset list does. LABEL_STUDIO_HOST above is immune — base.py strips
    # its own trailing slash before use — which is why the same source is
    # merely tidy there and load-bearing here.
    #
    # self.publicHostname is not the alternative: it names the bare host with no
    # scheme, and the membership test above compares whole origins, so a bare
    # host matches nothing either. Django says as much directly — since 4.0 a
    # scheme-less entry is a check error (4_0.E001).
    #
    # Not a wildcard, deliberately. "https://*.musher.io" would satisfy
    # Django — only entries containing '*' reach the subdomain-matching path
    # — and would make every other tenant's deployment on the shared edge a
    # trusted CSRF origin for this one.
    csrfTrustedOrigins:
      default: "${{ self.publicUrl }}"
      ui:
        label: Trusted origins
        order: 5
        prominence: SECONDARY
        examples:
          - https://label-studio.example.com
          - https://label-studio.example.com,https://alt.example.com

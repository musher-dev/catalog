    - object-storage
    - storage
    - minio-alternative
    - seaweedfs
  homepageURL: https://seaweedfs.com
  sourceRepositoryURL: https://github.com/seaweedfs/seaweedfs
  supportURL: https://github.com/seaweedfs/seaweedfs/wiki
  license: Apache-2.0
  icon: media/icon.png

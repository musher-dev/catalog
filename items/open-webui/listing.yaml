specVersion: v1
kind: LISTING
metadata:
  slug: open-webui
spec:
  itemType: BLUEPRINT
  displayName: Open WebUI
  summary: Self-hosted, multi-user chat interface for any OpenAI-compatible language-model API
  description: |
    ## What it is
    Open WebUI is a self-hosted web interface for chatting with LLMs through
    any OpenAI-compatible API — a hosted provider, an inference endpoint, or
    an engine you run yourself (Ollama included, via its `/v1` API). It adds
    multi-user accounts with role-based access, RAG over uploaded
    documents, and a library of reusable prompts and model presets.

    ## When to use
    - You want a private, multi-user chat front-end for models you host
      yourself or reach through your own API keys.
    - You want RAG over your own documents without sending them to a
      third-party service.
    - You're standardizing one chat UI for a team across several model
      providers.

    ## What you'll be asked for
    A **language model**, chosen once. The address, the credential and the
    model name travel together as a single connection, so Open WebUI can never
    end up holding a key from one provider beside an address from another, and
    changing provider later replaces all three at once rather than one at a
    time. Anything speaking the OpenAI chat-completions protocol will do,
    including an engine you run yourself.

    Open WebUI uses that model until an admin saves its connection settings
    under **Admin Settings → Connections**. From then on its own stored
    settings take precedence, so a redeploy does not override them — change
    providers from that page.

    ## Defaults
    Single-container deployment of `ghcr.io/open-webui/open-webui:v0.10.2`
    with the web UI on port 8080 behind the platform's HTTPS edge. The
    first account you register becomes the admin. The native Ollama
    integration is off; point the connection at an Ollama server's `/v1` URL
    instead. A session-token signing key is auto-generated, and an 8 GiB
    persistent volume mounted at `/app/backend/data` keeps accounts, chats,
    and uploaded documents across restarts.

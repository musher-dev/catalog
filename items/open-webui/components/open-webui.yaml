specVersion: v1
kind: COMPONENT
metadata:
  revision: 10
  description: Open WebUI chat interface for any OpenAI-compatible language-model API, signing viewers in as an OpenID Connect client of the platform.
spec:
  type: SERVICE
  workload:
    source:
      image: ghcr.io/open-webui/open-webui:v0.11.4
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
        # Open WebUI signs viewers in as an OpenID Connect client. These are the
        # routes it receives the authorization response on for its `oidc`
        # provider: /login/callback, plus the legacy /callback it still serves
        # (main.py, v0.11.4). The platform registers publicURL followed by each.
        oidc:
          redirectPaths:
            - /oauth/oidc/login/callback
            - /oauth/oidc/callback
        # The OpenAI- and Anthropic-compatible chat, model and embedding APIs,
        # the OpenAI proxy, and incoming channel webhooks. API clients call
        # these with an Open WebUI API key and no viewer session, and Open
        # WebUI authenticates every one itself (utils/auth.py; channel
        # webhooks carry their token in the path). A blueprint may let them
        # past the platform's sign-in. The UI keeps working through them,
        # because under OIDC it holds Open WebUI's own session.
        #
        # Not `bearer`. /api/v1/auths/signup checks no credential, and on a
        # deployment first installed before this revision, sign-up stays as
        # that install saved it (ui.enable_signup and ui.enable_login_form
        # are captured at first boot, config.py). Any bearer token would
        # then open self-registration to the internet.
        accessExemptions:
          paths:
            - /api/chat/completions
            - /api/v1/chat/completions
            - /api/models
            - /api/v1/models
            - /api/embeddings
            - /api/v1/embeddings
            - /api/v1/messages
            - /api/v1/channels/webhooks
            - /openai
    health:
      readiness:
        http:
          endpoint: primary
          path: /health
        # uvicorn binds the socket only after the FastAPI lifespan returns, so
        # nothing answers on 8080 until the whole first boot has run: ~60
        # alembic migrations, then a cold pull of the default embedding model
        # (sentence-transformers/all-MiniLM-L6-v2) from HuggingFace, then
        # loading it. The image bakes that model in at build time, but into
        # /app/backend/data/cache (SENTENCE_TRANSFORMERS_HOME, Dockerfile at
        # v0.11.4), which the data volume below mounts over. Every probe until
        # then is connection-refused. The old 30s + 3-failure gate expired
        # while the model was still loading and the agent reaped the container
        # mid-boot (observed live). Same budget shape
        # as label-studio and mlflow: the wait is carried by the initial delay,
        # because retries are cheap but few. First boot only — the model cache
        # and the DB both live in the data volume below.
        initialDelaySeconds: 180
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    volumes:
      data:
        minSizeGiB: 8
        mountPath: /app/backend/data
  contract:
    inputs:
      # ADR 0033: every value that reaches this workload enters through an
      # input, including the two constants below. They carry defaults, so no
      # blueprint has to wire them and no install form gains a field — but they
      # are pins like any other, and a composition may override one.
      enableOpenAIAPI:
        schema:
          type: string
        default: 'true'
        target:
          envVarKey: ENABLE_OPENAI_API
        # Already True by default in v0.11.4 (config.py:319); pinned so the item
        # does not depend on an upstream default it cannot see change.
        description: >-
          Whether the OpenAI-compatible API client is enabled, as the literal
          string the image parses.
      enableOllamaAPI:
        schema:
          type: string
        default: 'false'
        target:
          envVarKey: ENABLE_OLLAMA_API
        # The native Ollama integration is off, and is not a user choice. It
        # used to be an input whose default named a sibling `ollama` service
        # this deployment never contained. An Ollama server is reachable
        # through the `llm` node like any other engine, via its
        # OpenAI-compatible /v1.
        description: >-
          Whether the native Ollama client is enabled, as the literal string the
          image parses.
      # The three inputs below carry one language-model connection. They are not
      # supplied independently: the blueprint wires all three to the outputs of
      # the `llm` node, which takes the connection whole (components/llm.yaml).
      # An address from one provider beside a key from another would be a
      # visible authoring mistake in blueprint.yaml rather than a silent one
      # here.
      openaiApiBaseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        target:
          envVarKey: OPENAI_API_BASE_URL
        # CAPTURED AT FIRST BOOT, for all three of these inputs. v0.11.4 reads
        # these env vars into DEFAULT_CONFIG (config.py:2822), and on every
        # start main.py:367 calls seed_registered_defaults(). That runs
        # Config.seed_defaults (models/config.py:241), which writes a row for
        # every key that has none, and Config.get prefers a stored row. So the
        # first boot saves this URL, the key and the model into the database,
        # whether or not an admin ever opens Connections. Every later boot
        # ignores the env: rotating the credential, changing the organization
        # default, or overriding the connection does not reach a running
        # deployment. A fresh deployment, or an admin editing Connections,
        # does.
        #
        # ENABLE_PERSISTENT_CONFIG=false or RESET_CONFIG_ON_START=true would
        # make the env authoritative again. Neither is scoped to these keys:
        # both revert every admin setting on each restart. Rejected for that.
        # v0.11.0 made env authoritative again for single sign-on, but only
        # for `oauth.*` keys (ENABLE_OAUTH_PERSISTENT_CONFIG,
        # models/config.py:136); `openai.*` and `ui.default_models` are still
        # captured.
        #
        # Open WebUI appends /chat/completions (routers/openai.py:1636) and
        # also lists models from GET {url}/models (routers/openai.py:131). A
        # chat for a model missing from that list fails with MODEL_NOT_FOUND,
        # so the endpoint behind this URL has to serve /models too.
        description: >-
          Base URL of the OpenAI-compatible API Open WebUI sends chat requests
          to, saved at first boot.
      openaiApiKey:
        schema:
          type: string
        sensitive: true
        target:
          envVarKey: OPENAI_API_KEY
        description: Bearer credential for the API above.
      # Required and default-less: an acquired connection always carries a
      # model, so there is nothing for an optional case to cover. Users can
      # still pick any other model the API lists.
      defaultModels:
        schema:
          type: string
        target:
          envVarKey: DEFAULT_MODELS
        description: Model preselected for new chats.
      webuiSecretKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: WEBUI_SECRET_KEY
        description: Secret key used to sign session tokens
      # Sign-in through the platform's OpenID Connect provider. Unlike the
      # connection above, `oauth.*` settings are read from the environment on
      # every start (ENABLE_OAUTH_PERSISTENT_CONFIG defaults to False,
      # config.py, v0.11.4), so a rotated client secret takes effect on the
      # next restart. Open WebUI keys accounts on the provider's `sub`.
      oidcClientID:
        schema:
          type: string
        required: true
        target:
          envVarKey: OAUTH_CLIENT_ID
        description: Client identifier the platform registered for this endpoint.
      oidcClientSecret:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: OAUTH_CLIENT_SECRET
        description: Client secret the platform registered for this endpoint.
      # A discovery document, not the bare issuer: Open WebUI hands this URL
      # to Authlib as server_metadata_url (utils/oauth.py, v0.11.4).
      oidcDiscoveryURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        required: true
        target:
          envVarKey: OPENID_PROVIDER_URL
        description: URL of the platform's OpenID Connect discovery document.
      # Stated rather than derived. Open WebUI otherwise builds the URI with
      # request.url_for, which depends on the scheme the proxy reports.
      oidcRedirectURI:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        required: true
        target:
          envVarKey: OPENID_REDIRECT_URI
        description: Redirect URI Open WebUI sends with its authorization request.
      oauthSignup:
        schema:
          type: string
        default: 'true'
        target:
          envVarKey: ENABLE_OAUTH_SIGNUP
        description: >-
          Whether a first sign-in through the platform creates the account, as
          the literal string the image parses.
      # The platform's EMAIL claim is a verified address (blueprint
      # BP-ACCESS-006), so merging on it is safe. Without it, an account
      # registered with a password before this revision could never sign in
      # again, because password sign-in is off below.
      oauthMergeAccountsByEmail:
        schema:
          type: string
        default: 'true'
        target:
          envVarKey: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
        description: >-
          Whether a platform sign-in takes over the existing account with the
          same verified email, as the literal string the image parses.
      oauthProviderName:
        schema:
          type: string
        default: Musher
        target:
          envVarKey: OAUTH_PROVIDER_NAME
        description: Name the sign-in button gives the platform's provider.
      # The platform's provider requires PKCE with S256 (BP-ACCESS-008).
      oauthCodeChallengeMethod:
        schema:
          type: string
        default: S256
        target:
          envVarKey: OAUTH_CODE_CHALLENGE_METHOD
        description: PKCE method Open WebUI uses in its authorization request.
      oauthAutoRedirect:
        schema:
          type: string
        default: 'true'
        target:
          envVarKey: OAUTH_AUTO_REDIRECT
        description: >-
          Whether the sign-in page goes straight to the platform's provider, as
          the literal string the image parses.
      # Read from the environment on every start; refuses password sign-in
      # (routers/auths.py, v0.11.4).
      passwordAuth:
        schema:
          type: string
        default: 'false'
        target:
          envVarKey: ENABLE_PASSWORD_AUTH
        description: >-
          Whether accounts may sign in with a password, as the literal string
          the image parses.
      # Captured at first boot, so it reaches only a new deployment. With it
      # off, the first admin is the first person to sign in through the
      # platform rather than whoever registers first.
      loginForm:
        schema:
          type: string
        default: 'false'
        target:
          envVarKey: ENABLE_LOGIN_FORM
        description: >-
          Whether the email and password form is shown on a new deployment, as
          the literal string the image parses.
      # Captured at first boot, like the login form, so it reaches only a new
      # deployment; an admin toggles it under Settings afterwards. The
      # exempt API paths are useful only to a client holding an API key.
      apiKeys:
        schema:
          type: string
        default: 'true'
        target:
          envVarKey: ENABLE_API_KEYS
        description: >-
          Whether users may create API keys on a new deployment, as the literal
          string the image parses.
    outputs:
      # The client the platform registers for `primary` (component §5.2,
      # COMP-EP-012/014). Reading it means any blueprint deploying this
      # component must select viewerIdentity OIDC there. The blueprint binds
      # each output back into the input of the same name.
      oidcClientID:
        schema:
          type: string
        description: Client identifier the platform registered for this endpoint.
        from:
          endpoint: primary
          property: oidcClientID
      oidcClientSecret:
        schema:
          type: string
        sensitive: true
        description: Client secret the platform registered for this endpoint.
        from:
          endpoint: primary
          property: oidcClientSecret
      oidcDiscoveryURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: Discovery document of the platform's OpenID Connect provider.
        from:
          template: "${{ self.endpoints.primary.oidcIssuerURL }}/.well-known/openid-configuration"
      oidcRedirectURI:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        description: Redirect URI the platform registered for this endpoint.
        from:
          template: "${{ self.endpoints.primary.publicURL }}/oauth/oidc/login/callback"

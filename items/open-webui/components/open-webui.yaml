specVersion: v1
kind: COMPONENT
metadata:
  revision: 4
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: ghcr.io/open-webui/open-webui:v0.10.2
    endpoints:
      primary:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /health
        endpoint: primary
        # uvicorn binds the socket only after the FastAPI lifespan returns, so
        # nothing answers on 8080 until the whole first boot has run: ~50
        # alembic migrations, then a cold pull of the default embedding model
        # (sentence-transformers/all-MiniLM-L6-v2) from HuggingFace, then
        # loading it. Every probe until then is connection-refused. The old 30s
        # + 3-failure gate expired while the model was still loading and the
        # agent reaped the container mid-boot (observed live). Same budget shape
        # as label-studio and mlflow: the wait is carried by the initial delay,
        # because retries are cheap but few. First boot only — the model cache
        # and the DB both live in the data volume below.
        initialDelaySeconds: 180
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    envVars:
      # The language model arrives over the blueprint's `models` node as an
      # OpenAI-compatible base URL and key (the inputs below). ENABLE_OPENAI_API
      # already defaults to True in v0.10.2 (config.py); it is pinned so the item
      # does not depend on an upstream default it cannot see change.
      - key: ENABLE_OPENAI_API
        value:
          type: LITERAL
          value: 'true'
      # The native Ollama integration is off, and no longer a user choice. It
      # used to be an input whose default named a sibling `ollama` service this
      # deployment never contained. An Ollama server is reachable through the
      # `models` node like any other engine, via its OpenAI-compatible /v1.
      - key: ENABLE_OLLAMA_API
        value:
          type: LITERAL
          value: 'false'
    volumes:
      data:
        sizeGiB: 8
        mountPath: /app/backend/data
  contract:
    inputs:
      # The three inputs below are wired from the blueprint's `models` node and
      # never reach the install form: the deploying user types the endpoint once,
      # on that node. Each carries the node's resourceType, so blueprint §4.2
      # rejects a wire from anything that is not an LLM endpoint.
      openaiApiBaseUrl:
        schema:
          type: STRING
          format: ENDPOINT_URL
          resourceType: dev.musher.llm.base-url
        suppliedBy: CONNECTION
        target:
          envVarKey: OPENAI_API_BASE_URL
        # v0.10.2 reads this into DEFAULT_CONFIG['openai.api_base_urls'], and
        # Config.get (models/config.py) prefers a stored row over that default.
        # A row exists only once an admin saves Connections in the UI, so this
        # value holds until then and is ignored after — including on redeploy.
        # ENABLE_PERSISTENT_CONFIG=false would make it authoritative, at the
        # cost of every admin setting reverting on restart; not worth it here.
        description: >-
          Base URL of the OpenAI-compatible API Open WebUI sends chat requests
          to, until an admin saves connection settings in the UI.
      openaiApiKey:
        schema:
          type: STRING
          sensitive: true
          resourceType: dev.musher.llm.api-key
        suppliedBy: CONNECTION
        target:
          envVarKey: OPENAI_API_KEY
        description: Bearer credential for the API above.
      # Optional on both ends: the endpoint's model name is optional, and with
      # none Open WebUI simply lets each user pick from the models the API lists.
      defaultModels:
        schema:
          type: STRING
          resourceType: dev.musher.llm.model-name
        required: false
        suppliedBy: CONNECTION
        target:
          envVarKey: DEFAULT_MODELS
        description: Model preselected for new chats.
      webuiSecretKey:
        schema:
          type: STRING
          sensitive: true
        required: true
        suppliedBy: USER
        ui:
          label: WebUI secret key
          # After the endpoint's URL, key and model name (1-3 on the models
          # node), since the derived form is one form across both nodes.
          order: 4
        target:
          envVarKey: WEBUI_SECRET_KEY
        generator:
          byteLength: 32
          encoding: HEX
        description: Secret key used to sign session tokens
    outputs: {}

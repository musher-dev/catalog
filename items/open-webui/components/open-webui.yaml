specVersion: v1
kind: COMPONENT
metadata:
  version: 2
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: ghcr.io/open-webui/open-webui:v0.10.2
    endpoints:
      primary:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /health
        endpoint: primary
        # uvicorn binds the socket only after the FastAPI lifespan returns, so
        # nothing answers on 8080 until the whole first boot has run: ~50
        # alembic migrations, then a cold pull of the default embedding model
        # (sentence-transformers/all-MiniLM-L6-v2) from HuggingFace, then
        # loading it. Every probe until then is connection-refused. The old 30s
        # + 3-failure gate expired while the model was still loading and the
        # agent reaped the container mid-boot (observed live). Same budget shape
        # as label-studio and mlflow: the wait is carried by the initial delay,
        # because retries are cheap but few. First boot only — the model cache
        # and the DB both live in the data volume below.
        initialDelaySeconds: 180
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    volumes:
      data:
        sizeGib: 8
        mountPath: /app/backend/data
  contract:
    inputs:
      enableOllamaApi:
        schema:
          type: BOOLEAN
          default: 'false'
        isRequired: false
        suppliedBy: USER
        ui:
          label: Enable Ollama API
        target:
          envVarKey: ENABLE_OLLAMA_API
        description: >-
          Enable the Ollama backend integration. Off by default because no Ollama
          ships with this deployment; turn on only when an Ollama endpoint is
          reachable (and set the base URL), otherwise the UI logs pointless
          connection errors (docs.openwebui.com env-configuration).
      ollamaBaseUrl:
        schema:
          type: STRING
          default: http://ollama:11434
        isRequired: false
        suppliedBy: USER
        ui:
          label: Ollama base URL
        target:
          envVarKey: OLLAMA_BASE_URL
        description: >-
          Base URL of the Ollama API the WebUI talks to when the Ollama
          integration is enabled. The default points at a sibling `ollama`
          service that is NOT part of this deployment; replace it with your own
          endpoint when enabling.
      webuiSecretKey:
        schema:
          type: STRING
          isSensitive: true
        isRequired: true
        suppliedBy: USER
        ui:
          label: WebUI secret key
        target:
          envVarKey: WEBUI_SECRET_KEY
        generator:
          byteLength: 32
          encoding: HEX
        description: Secret key used to sign session tokens
    outputs: {}

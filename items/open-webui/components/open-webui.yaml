specVersion: v1
kind: COMPONENT
metadata:
  revision: 7
  description: Open WebUI chat interface for any OpenAI-compatible language-model API.
spec:
  type: SERVICE
  workload:
    source:
      image: ghcr.io/open-webui/open-webui:v0.10.2
    endpoints:
      primary:
        targetPort: 8080
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /health
        # uvicorn binds the socket only after the FastAPI lifespan returns, so
        # nothing answers on 8080 until the whole first boot has run: ~50
        # alembic migrations, then a cold pull of the default embedding model
        # (sentence-transformers/all-MiniLM-L6-v2) from HuggingFace, then
        # loading it. Every probe until then is connection-refused. The old 30s
        # + 3-failure gate expired while the model was still loading and the
        # agent reaped the container mid-boot (observed live). Same budget shape
        # as label-studio and mlflow: the wait is carried by the initial delay,
        # because retries are cheap but few. First boot only — the model cache
        # and the DB both live in the data volume below.
        initialDelaySeconds: 180
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 10
    envVars:
      # The language model arrives as one atomic connection — endpoint,
      # credential and model acquired together — over the connection requirement
      # declared at the foot of this file. ENABLE_OPENAI_API already defaults to
      # True in v0.10.2 (config.py); it is pinned so the item does not depend on
      # an upstream default it cannot see change.
      ENABLE_OPENAI_API: 'true'
      # The native Ollama integration is off, and no longer a user choice. It
      # used to be an input whose default named a sibling `ollama` service this
      # deployment never contained. An Ollama server is reachable through the
      # connection like any other engine, via its OpenAI-compatible /v1.
      ENABLE_OLLAMA_API: 'false'
    volumes:
      data:
        minSizeGiB: 8
        mountPath: /app/backend/data
  contract:
    inputs:
      # The three inputs below are the roles of one atomic connection, declared
      # under connectionRequirements at the foot of this file. They are never
      # bound one at a time and never reach the install form separately: the
      # deploying user picks a language model once, and the platform supplies the
      # address, the credential and the model name together. An address from one
      # provider beside a key from another is unreachable by construction.
      openaiApiBaseURL:
        schema:
          type: string
        presentationHint: ENDPOINT_URL
        target:
          envVarKey: OPENAI_API_BASE_URL
        # CAPTURED AT FIRST BOOT, for all three connection roles. v0.10.2 reads
        # these env vars into DEFAULT_CONFIG (config.py), and on every start
        # main.py:317 calls seed_registered_defaults(). That runs
        # Config.seed_defaults (models/config.py:237), which writes a row for
        # every key that has none, and Config.get prefers a stored row. So the
        # first boot saves this URL, the key and the model into the database,
        # whether or not an admin ever opens Connections. Every later boot
        # ignores the env: rotating the credential, changing the organization
        # default, or overriding the connection does not reach a running
        # deployment. A fresh deployment, or an admin editing Connections,
        # does.
        #
        # ENABLE_PERSISTENT_CONFIG=false or RESET_CONFIG_ON_START=true would
        # make the env authoritative again. Neither is scoped to these keys:
        # both revert every admin setting on each restart. Rejected for that.
        #
        # Open WebUI appends /chat/completions (routers/openai.py:1238) and
        # also lists models from GET {url}/models (routers/openai.py:128). A
        # chat for a model missing from that list fails with MODEL_NOT_FOUND,
        # so the endpoint behind this URL has to serve /models too.
        description: >-
          Base URL of the OpenAI-compatible API Open WebUI sends chat requests
          to, saved at first boot.
      openaiApiKey:
        schema:
          type: string
        sensitive: true
        target:
          envVarKey: OPENAI_API_KEY
        description: Bearer credential for the API above.
      # Required, because a connection role names a required input with no
      # default (COMP-CONNECTION-001) — and an acquired connection always
      # carries a model, so there is nothing left for the old optional case to
      # cover. Users can still pick any other model the API lists.
      defaultModels:
        schema:
          type: string
        target:
          envVarKey: DEFAULT_MODELS
        description: Model preselected for new chats.
      webuiSecretKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: WEBUI_SECRET_KEY
        description: Secret key used to sign session tokens
    outputs: {}
    connectionRequirements:
      # Streaming and tool calls. Open WebUI streams chat completions by
      # default. v0.10.2 also defaults to native function calling: every UI
      # chat is sent with its built-in tools (time, knowledge-base retrieval,
      # chat search) as OpenAI `tools`, unless an admin sets a model's function
      # calling to `legacy` (utils/middleware.py:2518-2522, 2763-2767). An
      # endpoint without tool calls would be accepted and then fail on ordinary
      # chats. Everything else it asks of the model is plain chat: title, tag
      # and follow-up generation reuse the chat model, and RAG embeds locally
      # with sentence-transformers.
      llm:
        protocol: OPENAI_CHAT_COMPLETIONS
        capabilities:
          - STREAMING
          - TOOL_CALLS
        inputs:
          baseURL: openaiApiBaseURL
          apiKey: openaiApiKey
          model: defaultModels

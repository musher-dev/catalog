# A node this platform does not run (component spec §5.6). There is no image,
# no compute and no address of its own: `spec.external.resourceType` says what
# kind of service the node addresses, and nothing more.
#
# The values an application needs to reach that service arrive as inputs the
# blueprint supplies, and leave as INPUT outputs. Publishing them from one node
# is the point: an address from one provider beside a credential from another
# reaches nothing, and a consumer wiring two of them from this node's `fromNode`
# is taking them from one source by construction.
#
# Deliberately vendor-neutral. The address may be a Musher inference endpoint, a
# third-party service, or an engine the customer runs themselves; this document
# cannot tell the difference and must not pretend to. Nothing resolves the
# address, connects to it, or checks that anything answers there (component
# spec §11) — a reachability check against a user-supplied address would be a
# server-side request forgery primitive.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 2
spec:
  external:
    resourceType: dev.musher.llm.chat-completions
  contract:
    inputs:
      baseUrl:
        schema:
          type: STRING
          format: ENDPOINT_URL
          resourceType: dev.musher.llm.base-url
        description: >-
          Base URL of the chat-completions API this node addresses. Anything
          speaking the same wire will do; nothing here resolves it or connects
          to it.
      apiKey:
        schema:
          type: STRING
          sensitive: true
          resourceType: dev.musher.llm.api-key
        description: Bearer credential presented to the service above.
      model:
        schema:
          type: STRING
          resourceType: dev.musher.llm.model-name
        required: false
        description: Name the service uses to select which model answers.
    outputs:
      baseUrl:
        schema:
          type: STRING
          format: ENDPOINT_URL
          resourceType: dev.musher.llm.base-url
        description: >-
          Base URL a consuming workload sends chat-completion requests to. It is
          the value this node was given, republished so a sibling can be pointed
          at the same service.
        valueFrom: INPUT
        input: baseUrl
      apiKey:
        schema:
          type: STRING
          sensitive: true
          resourceType: dev.musher.llm.api-key
        description: >-
          Bearer credential a consuming workload presents to the service above,
          republished from this node's own input.
        valueFrom: INPUT
        input: apiKey
      model:
        schema:
          type: STRING
          resourceType: dev.musher.llm.model-name
        description: >-
          Model name a consuming workload selects by default, republished from
          this node's own input.
        valueFrom: INPUT
        input: model

specVersion: v1
kind: BLUEPRINT
metadata:
  slug: open-webui
  revision: 8
  description: Open WebUI behind the platform's sign-in, signing viewers in through its OpenID Connect provider, wired to the language model the installer selects.
# Two nodes, one of which runs nothing. The language model is an EXTERNAL node
# (`llm`) standing for the model API: it takes the connection whole — endpoint,
# credential and model acquired together — and publishes the three members as
# outputs. `web` wires its three ordinary inputs to them, the way any node wires
# to a managed database's.
#
# That is what keeps the three consistent. One connection parameter fills one
# external node, so its members always come from one selection; wiring `apiKey`
# from one node and `baseURL` from another would be visible here rather than
# silent.
#
# The install form is still two fields: the model the chat UI talks to, and Open
# WebUI's own generated signing key. The `llm` node adds none — it reads the
# connection the organization already configured, so a fresh deployment answers
# chats without a key being pasted into it.
spec:
  components:
    llm:
      componentRef: ./components/llm.yaml
      # No compute, no volumes, no exposure: an EXTERNAL node runs nothing
      # (BP-NODE-002).
      bindings:
        llm:
          parameter: llm
    web:
      componentRef: ./components/open-webui.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 8
      # The platform signs viewers in, and Open WebUI signs them in again as an
      # OpenID Connect client of the platform, with no second password. It
      # creates accounts with an email and a display name, so the node
      # releases both claims. The chat-completion API is exempt for API-key
      # clients (components/open-webui.yaml).
      exposure:
        primary:
          visibility: PUBLIC
          access: AUTHENTICATED
          viewerIdentity: OIDC
          viewerClaims:
            - EMAIL
            - NAME
          accessExemptions:
            - PATHS
      bindings:
        webuiSecretKey:
          parameter: webuiSecretKey
        # The platform's OIDC client for this node's own `primary` endpoint. A
        # node reading its own endpoint outputs is a discovery dependency and
        # not a value cycle (BP-CONN-002).
        oidcClientID:
          node: web
          output: oidcClientID
        oidcClientSecret:
          node: web
          output: oidcClientSecret
        oidcDiscoveryURL:
          node: web
          output: oidcDiscoveryURL
        oidcRedirectURI:
          node: web
          output: oidcRedirectURI
        # The three members of the one connection the `llm` node holds.
        openaiApiBaseURL:
          node: llm
          output: baseURL
        openaiApiKey:
          node: llm
          output: apiKey
        defaultModels:
          node: llm
          output: model
  parameters:
    # A connection parameter: it names one atomic connection the organization
    # has configured, and binds only to the `llm` node's connection input
    # (BP-CONNECTION-001). It carries no schema of its own — the input it fills
    # declares the contract.
    llm:
      from: "${{ connections.llm.default }}"
      ui:
        label: Language model
        order: 1
    webuiSecretKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: WebUI secret key
        order: 2

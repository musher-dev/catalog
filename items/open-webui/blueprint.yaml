specVersion: v1
kind: BLUEPRINT
metadata:
  slug: open-webui
  revision: 4
  description: Open WebUI chat interface wired to the language model the installer selects, as one connection.
# One participant. The language model is not a node: it is an atomic connection
# — endpoint, credential and model acquired together — bound to the component's
# `llm` requirement. That replaces the external `models` node this item used to
# carry, which asked for a URL, a key and a model name as three independent
# values and left it to the author to keep them consistent.
#
# The install form is two fields: the model the chat UI talks to, and Open
# WebUI's own generated signing key.
spec:
  components:
    web:
      componentRef: ./components/open-webui.yaml
      compute:
        profile: general.standard.small
      volumes:
        data:
          sizeGiB: 8
      exposure:
        primary: PUBLIC
      bindings:
        webuiSecretKey:
          parameter: webuiSecretKey
      # A connection parameter is bound here and never through `bindings`; the
      # three inputs the requirement owns take no binding of their own.
      connectionBindings:
        llm:
          parameter: llm
  parameters:
    llm:
      from: "${{ connections.llm.default }}"
      ui:
        label: Language model
        order: 1
    webuiSecretKey:
      generator:
        byteLength: 32
        encoding: HEX
      ui:
        label: WebUI secret key
        order: 2

specVersion: v2
kind: LISTING
metadata:
  slug: redis
spec:
  itemType: COMPONENT
  displayName: Redis
  summary: In-memory data store for caching, queues, sessions, and pub/sub
  overview: |
    ## What it is
    Redis is an in-memory data structure store serving sub-millisecond
    reads and writes over strings, hashes, lists, sets, sorted sets, and
    streams. Teams reach for it as a cache, session store, message broker,
    and lightweight queue.

    ## When to use
    - You're adding a cache or session store in front of a slower primary
      database.
    - You need a lightweight queue, rate limiter, or pub/sub channel
      between your services.
    - You're deploying another workload that expects a Redis URL.

    ## Defaults
    Single-container deployment of `redis:8.8.3-alpine` listening on the
    standard port 6379 as a private TCP endpoint — reachable by your other
    workloads, not exposed to the public internet. The server runs with
    append-only-file persistence enabled, journaling writes to the 5 GiB
    persistent volume mounted at `/data` so data survives restarts. The one
    thing you set at deploy is the password.

    ## Access and security
    Redis requires a **password**. You set it when you deploy, and you can
    reveal it on the deployment's Installation tab later. Every client
    authenticates with it before Redis answers, for example with the URL
    `redis://:<password>@<host>:6379`. Use at least 16 letters, digits or
    `._~+/=-`: Redis reads the password as one word of its configuration, so
    it can carry no spaces or quotes. The endpoint is private as well, so the
    public internet cannot reach it.
  category: DATABASES
  lifecycleStage: STABLE
  tags:
    - cache
    - key-value
    - redis
    - message-broker

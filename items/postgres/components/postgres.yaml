specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
    envVars:
      - key: PGDATA
        value:
          type: LITERAL
          value: /var/lib/postgresql/data/pgdata
    volumes:
      data:
        sizeGiB: 10
        mountPath: /var/lib/postgresql/data
  contract:
    inputs:
      postgresPassword:
        schema:
          type: STRING
          sensitive: true
        required: true
        target:
          envVarKey: POSTGRES_PASSWORD
        description: >-
          Password for the database superuser; copy it from the deployment's
          Configuration tab.
      postgresUser:
        schema:
          type: STRING
          default: postgres
        required: false
        target:
          envVarKey: POSTGRES_USER
        description: Role the database is initialised with and clients connect as.
      postgresDb:
        schema:
          type: STRING
          default: app
        required: false
        target:
          envVarKey: POSTGRES_DB
        description: Database created on first boot for the application to use.
    outputs:
      address:
        schema:
          type: STRING
          resourceType: dev.musher.postgresql.address
        description: >-
          Mesh-internal `host:port` of the database endpoint (for example
          `db-myapp.internal:5432`), resolvable only by workloads in the same
          deployment. Wire it into a consuming component's input to point that
          workload at this database.
        valueFrom: DERIVED

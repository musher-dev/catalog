specVersion: v1
kind: COMPONENT
metadata:
  revision: 4
  description: PostgreSQL relational database with a single persistent data volume.
spec:
  type: SERVICE
  workload:
    source:
      image: postgres:17.10-alpine
    endpoints:
      primary:
        targetPort: 5432
        protocol: TCP
    envVars:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      data:
        minSizeGiB: 10
        mountPath: /var/lib/postgresql/data
  contract:
    inputs:
      postgresPassword:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: POSTGRES_PASSWORD
        description: >-
          Password for the database superuser; copy it from the deployment's
          Configuration tab.
      postgresUser:
        schema:
          type: string
        default: postgres
        required: false
        target:
          envVarKey: POSTGRES_USER
        description: Role the database is initialised with and clients connect as.
      postgresDb:
        schema:
          type: string
        default: app
        required: false
        target:
          envVarKey: POSTGRES_DB
        description: Database created on first boot for the application to use.
    outputs:
      address:
        schema:
          type: string
        description: >-
          Mesh-internal `host:port` of the database endpoint (for example
          `db-myapp.internal:5432`), resolvable only by workloads in the same
          deployment. Wire it into a consuming component's input to point that
          workload at this database.
        from:
          endpoint: primary
          property: privateAddress

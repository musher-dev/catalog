specVersion: v1
kind: COMPONENT
metadata:
  revision: 2
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
    envVars:
      - key: PGDATA
        value:
          type: LITERAL
          value: /var/lib/postgresql/data/pgdata
    volumes:
      data:
        sizeGiB: 10
        mountPath: /var/lib/postgresql/data
  contract:
    inputs:
      postgresPassword:
        schema:
          type: STRING
          sensitive: true
        required: true
        suppliedBy: USER
        ui:
          label: Database password
          order: 1
        target:
          envVarKey: POSTGRES_PASSWORD
        # ALPHANUMERIC rather than HEX so the value survives being pasted into a
        # postgresql:// URL without percent-encoding. 32 bytes matches the other
        # machine credentials in the corpus; the 24-byte tier is for passwords a
        # person reads and types.
        generator:
          byteLength: 32
          encoding: ALPHANUMERIC
        description: >-
          Auto-generated password for the database superuser; copy it from the
          deployment's Configuration tab.
      postgresUser:
        schema:
          type: STRING
          default: postgres
        required: false
        suppliedBy: USER
        ui:
          label: Database user
          order: 2
        target:
          envVarKey: POSTGRES_USER
      postgresDb:
        schema:
          type: STRING
          default: app
        required: false
        suppliedBy: USER
        ui:
          label: Database name
          order: 3
        target:
          envVarKey: POSTGRES_DB
    outputs:
      address:
        schema:
          type: STRING
          resourceType: dev.musher.postgresql.address
        description: >-
          Mesh-internal `host:port` of the database endpoint (for example
          `db-myapp.internal:5432`), resolvable only by workloads in the same
          deployment. Wire it into a consuming component's CONNECTION input to
          point that workload at this database.
        valueFrom: DERIVED

specVersion: v1
kind: COMPONENT
metadata:
  revision: 3
  description: Meilisearch search engine serving its HTTP API from one data volume.
spec:
  type: SERVICE
  workload:
    source:
      image: getmeili/meilisearch:v1.50.0
    endpoints:
      primary:
        targetPort: 7700
        protocol: HTTP
    health:
      readiness:
        http:
          endpoint: primary
          path: /health
        initialDelaySeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 3
    envVars:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      data:
        minSizeGiB: 8
        mountPath: /meili_data
  contract:
    inputs:
      masterKey:
        schema:
          type: string
        sensitive: true
        required: true
        target:
          envVarKey: MEILI_MASTER_KEY
        description: Bearer token for admin and indexing API access
    outputs: {}
